[package]
name = "fuwa-desktop"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "fuwa for Windows, macOS and Linux: a native app (GPUI Kit) for any fuwa instance"
license = "Apache-2.0"
repository = "https://github.com/waifu-devs/fuwa"
publish = false
default-run = "fuwa-desktop"

[[bin]]
name = "fuwa-desktop"
path = "src/main.rs"

[lib]
name = "fuwa_desktop"
path = "src/lib.rs"

# Its own workspace: GPUI's dependencies stay out of the server's lockfile and
# its reproducible build. The vendored crates aren't members (fmt and clippy
# leave them as they are).
[workspace]
exclude = ["vendor"]

[dependencies]
cpal = "0.18"
opus = "0.4"
# The camera: V4L2, AVFoundation or Media Foundation.
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
# MJPEG frames from cameras that send only those.
zune-jpeg = "0.5"
# Screens and windows to share; X11 only on Linux (Wayland would need PipeWire).
zed-scap = { version = "=0.0.8-zed", default-features = false, features = ["x11"] }
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
# Encrypts what the vault keeps on disk, with a key from the system keychain.
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures = "0.3"
# The encryption for direct messages, the same crate the web app runs as WebAssembly.
fuwa-e2ee = { path = "../e2ee", features = ["client"] }
getrandom = "0.3"
gpui-kit = "0.7.0"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "webpki-tokio", "ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
# Session tokens and the vault key live in the system's keychain (Keychain,
# Credential Manager, Secret Service).
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
# The system's own notifications, while the window is in the background.
notify-rust = "4.18"
open = "5"
parking_lot = "0.12"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
sha2 = "0.10"
# Echo cancellation, noise suppression and automatic gain for the microphone:
# WebRTC's audio processing, ported to Rust (no C++ to build).
sonora = "0.2"
# Sound files people pick for the app's sounds (Ogg Opus goes through `opus`).
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "adpcm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"
tonic-web = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Runs the backdrop's WGSL shaders offscreen (core/effects/gpu.rs): the wgpu
# GPUI already draws with on Linux, so it isn't built twice there.
wgpu = "29.0.4"
# The frames those shaders make, and video as it's decoded, as pictures for
# GPUI (the version GPUI uses).
image = { version = "0.25", default-features = false }
# The system's own window under a GPUI one, for what GPUI can't do: letting
# clicks through the game overlay (ui/game_overlay.rs).
raw-window-handle = "0.6"

# Asking macOS for the microphone and camera (core/voice/access.rs).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSString"] }
# A shared screen's sound (core/voice/screen_sound): ScreenCaptureKit, which
# leaves the app's own sound out.
dispatch2 = "0.3"
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-media"] }

# A shared screen's sound on Linux: PulseAudio's protocol, which PipeWire
# speaks too, in Rust (no libpulse to install).
[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"
# Keys heard while a game is in front, the window in front, and the game
# overlay letting clicks through (core/hotkeys.rs, core/foreground.rs): X11's
# protocol in Rust, the version GPUI uses.
x11rb = { version = "0.13", features = ["shape"] }

# Cameras and shared screens in calls are VP8, through libvpx: a static
# build, fetched prebuilt for each system (checked against its SHA-256), so
# installers need no libvpx of their own.
[target.'cfg(not(windows))'.dependencies]
shiguredo_libvpx = { version = "=2026.1.0", optional = true }
# The same calls on a libvpx found on the system, for trying Windows' path elsewhere.
env-libvpx-sys = { version = "=5.1.3", features = ["generate"], optional = true }

[target.'cfg(windows)'.dependencies]
# zed-scap asks for windows-capture 1, but 1.5 changed Settings::new; held
# at the last one it builds with.
windows-capture = "=1.4.4"
# The prebuilt libvpx above is built with MinGW, which MSVC can't link; on
# Windows it's vcpkg's (VPX_LIB_DIR and friends, see desktop.yml), with
# bindings made from its headers.
env-libvpx-sys = { version = "=5.1.3", features = ["generate"] }
# A shared screen's sound: WASAPI's process loopback, which leaves the app's own sound out.
# Keys heard while a game is in front, the window in front, and the game
# overlay letting clicks through: KeyboardAndMouse, WindowsAndMessaging, Gdi.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# What  expands to names it.
windows-core = "0.62"

[features]
default = ["prebuilt-libvpx"]
prebuilt-libvpx = ["dep:shiguredo_libvpx"]
# Windows' libvpx path (core/voice/libvpx.rs) on another system, against its
# libvpx, instead of the prebuilt one (both name their library vpx):
# --no-default-features --features system-libvpx.
system-libvpx = ["dep:env-libvpx-sys"]

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
# Real instances for the end-to-end tests.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
fuwa-server = { path = "../server" }
tempfile = "3"

# Installers, made by cargo-packager (.github/workflows/desktop.yml).
[package.metadata.packager]
product-name = "fuwa"
identifier = "dev.waifu.fuwa"
publisher = "Waifu Devs"
homepage = "https://www.waifu.dev/projects"
category = "SocialNetworking"
copyright = "Waifu Devs"
out-dir = "target/packages"
binaries-dir = "target/release"
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/64x64.png",
  "packaging/icons/128x128.png",
  "packaging/icons/256x256.png",
  "packaging/icons/512x512.png",
  "packaging/icons/icon.ico",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Why the app wants the microphone and camera: macOS asks only when it's said.
info-plist-path = "packaging/macos/Info.plist"
entitlements = "packaging/macos/entitlements.plist"
# Signed ad hoc ("-"), so the bundle and what it says hold together and macOS
# remembers what was allowed. Not a Developer ID yet: still a warning the first time.
signing-identity = "-"

[package.metadata.packager.nsis]
# Installs for the person running it, so it doesn't ask for an administrator.
installer-mode = "currentUser"

# Our copy of GPUI (vendor/README.md): rounded clipping, backdrop blur and
# transforms on every renderer.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
