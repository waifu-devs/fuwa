name: Publish image

# Every merge to master publishes ghcr.io/waifu-devs/fuwa:latest (and :sha-<commit>)
# and redeploys fuwa.chat onto it, and every release tag (v1.2.3) publishes :1.2.3
# and :1.2 too, the tags self-hosters pin to. Each image runs on x86 and ARM
# machines alike and comes with a signed record of the commit and workflow that
# built it. Anyone can check that record:
#   gh attestation verify oci://ghcr.io/waifu-devs/fuwa:latest --repo waifu-devs/fuwa
#
# A merge that changes nothing the image is built from (docs, the desktop app,
# .railway/, other workflows: .github/scripts/changes.sh) builds and redeploys
# nothing; the next one that does carries it. A merge that lands while an earlier
# one is still building stops that build and builds both, so a burst of merges
# builds and redeploys fuwa.chat once. A redeploy that has started always finishes.
on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Whether anything the image is built from changed since the last run on master
  # that finished (a release tag always builds).
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.changes.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: changes
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs?branch=master&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty') || base=
            echo "last published from: ${base:-none}"
            .github/scripts/changes.sh since "${base:-none}" | grep '^image=' >> "$GITHUB_OUTPUT"
          else
            .github/scripts/changes.sh all | grep '^image=' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # Each architecture builds on a machine of its own kind (emulating ARM would
  # take an hour of Rust), and pushes its image by digest alone. The next job
  # puts the two under the tags.
  build:
    name: Build (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    # On master a newer build stops this one (a run it stops never counts as
    # published, so the newer one compares against the last that finished and
    # carries this one's changes). Tags always finish.
    concurrency:
      group: publish-build-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      # Sign the build's provenance with this workflow's identity, and store it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: FUWA_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Keep the digest for the next job
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  tags:
    name: Tag the image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sign the build's provenance with this workflow's identity, and store it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest follows master. A release v1.2.3 gets 1.2.3 and 1.2 (and 1, from
      # 1.0.0 on; before that every minor version may change things).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Put both architectures under the tags
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: index
        name: Find the tagged image's digest
        run: |
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # fuwa.chat runs :latest (.railway/railway.ts), and Railway's own check for a new
  # image can take hours, so tell it now. RAILWAY_TOKEN is the project token for the
  # "fuwa" project's production environment.
  deploy:
    name: Deploy fuwa.chat
    needs: tags
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency: deploy-fuwa-chat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Every service the config runs fuwa's image on: `fuwa`, or each part of a split
      # instance (the directory, the shards, then the gateways); fuwafuwa builds from
      # the repository itself. --from-source pulls :latest again; a plain redeploy
      # would rerun the old image.
      - name: Redeploy
        run: |
          services=$(node --experimental-strip-types --input-type=module -e '
            const { createRailwayContext, project } = await import("railway/iac");
            const { default: config } = await import("./.railway/railway.ts");
            const { resources } = await config(createRailwayContext({ environment: "production" }), project);
            for (const r of resources.flat(Infinity)) {
              if (r.type === "service" && r.source?.image?.startsWith(`${process.env.IMAGE}:`)) console.log(r.name);
            }
          ')
          for service in $services; do
            npx --yes @railway/cli@5.63.1 redeploy --service "$service" --from-source --yes
          done
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
