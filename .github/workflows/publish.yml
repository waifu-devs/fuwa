name: Publish image

# Every merge to master publishes ghcr.io/waifu-devs/fuwa:latest (and :sha-<commit>)
# and redeploys fuwa.chat onto it, and every release tag (v1.2.3) publishes :1.2.3
# and :1.2 too, the tags self-hosters pin to. Each image runs on x86 and ARM
# machines alike and comes with a signed record of the commit and workflow that
# built it. Anyone can check that record:
#   gh attestation verify oci://ghcr.io/waifu-devs/fuwa:latest --repo waifu-devs/fuwa
on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  # Sign the build's provenance with this workflow's identity, and store it.
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Each architecture builds on a machine of its own kind (emulating ARM would
  # take an hour of Rust), and pushes its image by digest alone. The next job
  # puts the two under the tags.
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: FUWA_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Keep the digest for the next job
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  tags:
    name: Tag the image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest follows master. A release v1.2.3 gets 1.2.3 and 1.2 (and 1, from
      # 1.0.0 on; before that every minor version may change things).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Put both architectures under the tags
        working-directory: digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - id: index
        name: Find the tagged image's digest
        run: |
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # fuwa.chat runs :latest (.railway/railway.ts), and Railway's own check for a new
  # image can take hours, so tell it now. RAILWAY_TOKEN is the project token for the
  # "fuwa" project's production environment.
  deploy:
    name: Deploy fuwa.chat
    needs: tags
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions: {}
    concurrency: deploy-fuwa-chat
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --from-source pulls :latest again; a plain redeploy would rerun the old image.
      - run: npx --yes @railway/cli@5.63.1 redeploy --service fuwa --from-source --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
