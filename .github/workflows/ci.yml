name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Actions > CI > Run workflow runs everything, the slow jobs included.
  workflow_dispatch:

jobs:
  server:
    name: Server (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  web:
    name: Web client (typecheck, build, served by the server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated protocol code matches proto/
        run: |
          pnpm run generate
          git diff --exit-code -- src/gen
          test -z "$(git status --porcelain -- src/gen)"
      - run: pnpm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: The server embeds and serves the app
        working-directory: .
        run: |
          cargo clippy --all-targets --locked --features web -- -D warnings
          cargo test --locked --features web

  proto:
    name: Protocol (buf lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Turn on once fuwa.v1 has shipped, so changes can't break clients.
          breaking: false
          push: false
          # Results show in the check itself; a PR comment needs write access.
          pr_comment: false

  docker:
    name: Docker image
    # Slow (about 8 minutes), so it's off on pull requests and pushes for now and
    # only runs when CI is started by hand. Delete this line to turn it back on.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fuwa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Starts, answers its health check and serves the app
        run: |
          docker run -d --name fuwa -p 8080:8080 -e FUWA_TELEMETRY=off fuwa:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              curl -fsS http://localhost:8080/ | grep -q '<div id="root">' && exit 0
              echo "the web client isn't in the image"
              break
            fi
            sleep 1
          done
          docker logs fuwa
          exit 1
