name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  server:
    name: Server (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  proto:
    name: Protocol (buf lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Turn on once fuwa.v1 has shipped, so changes can't break clients.
          breaking: false
          push: false

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fuwa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Starts and answers its health check
        run: |
          docker run -d --name fuwa -p 8080:8080 -e FUWA_TELEMETRY=off fuwa:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs fuwa
          exit 1
