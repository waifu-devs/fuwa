name: CI

on:
  pull_request:
    # closed: merging or closing a pull request stops its run (below).
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  # Actions > CI > Run workflow runs everything, the slow jobs included.
  workflow_dispatch:

# One run per pull request: a new push stops the run for the old one, and merging
# stops it too, since master's own run then tests the merged code. Runs on master
# all finish, so each commit there gets its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Which jobs this change needs (.github/scripts/changes.sh): a job whose files didn't
  # change is skipped, and "CI passed" stands for all of them.
  changes:
    name: What changed
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.changes.outputs.server }}
      desktop: ${{ steps.changes.outputs.desktop }}
      proto: ${{ steps.changes.outputs.proto }}
      docker: ${{ steps.changes.outputs.docker }}
      sdk: ${{ steps.changes.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        shell: bash
        run: |
          case "$EVENT" in
            pull_request) .github/scripts/changes.sh pr "$PR" >> "$GITHUB_OUTPUT" ;;
            # The image check is for pull requests: on master, Publish image builds it.
            push) .github/scripts/changes.sh since "$BEFORE" | sed 's/^docker=.*/docker=false/' >> "$GITHUB_OUTPUT" ;;
            *) .github/scripts/changes.sh all >> "$GITHUB_OUTPUT" ;;
          esac
          cat "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}

  server:
    # One Rust build for both: the tests run with the web client built in, and a
    # second clippy (which reuses the dependencies) keeps the API-only build clean.
    # The web client needs its WebAssembly (e2ee-wasm) built first.
    name: Server and web client (fmt, clippy, tests, build)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generated protocol code matches proto/
        working-directory: web
        run: |
          pnpm run generate
          git diff --exit-code -- src/gen
          test -z "$(git status --porcelain -- src/gen)"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # Only master saves the cache, which every pull request starts from; a pull
      # request's own copy would only crowd the others out of the 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The version e2ee-wasm/Cargo.toml pins.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Encryption for direct messages, as WebAssembly
        run: pnpm run wasm
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: cargo fmt --all --check
      - name: Clippy, API only
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy, with the web client
        run: cargo clippy --all-targets --locked --features web -- -D warnings
      - name: Tests, with the web client (the server embeds and serves it)
        run: cargo test --locked --features web

  desktop:
    # Its own workspace (GPUI stays out of the server's lock file); its tests
    # run a real instance in-process, so they build the server too.
    name: Desktop app (fmt, clippy, tests)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: What GPUI needs on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  proto:
    name: Protocol (buf lint)
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Turn on once fuwa.v1 has shipped, so changes can't break clients.
          breaking: false
          push: false
          # Results show in the check itself; a PR comment needs write access.
          pr_comment: false

  docker:
    name: Docker image
    # About 8 minutes from scratch, so it runs only for a pull request that changes
    # what the image is built with (the Dockerfile, manifests, the web build's
    # config: .github/scripts/changes.sh), or when CI is started by hand. It starts
    # from the layers Publish image keeps for master and saves none of its own.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fuwa:ci
          cache-from: type=gha,scope=amd64
      - name: Starts, answers its health check and serves the app
        run: |
          docker run -d --name fuwa -p 8080:8080 -e FUWA_TELEMETRY=off fuwa:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              curl -fsS http://localhost:8080/ | grep -q '<div id="root">' && exit 0
              echo "the web client isn't in the image"
              break
            fi
            sleep 1
          done
          docker logs fuwa
          exit 1

  sdk:
    # The TypeScript SDK (sdk/): its generated code matches proto/, it builds
    # (ES modules and CommonJS), and its tests drive a real instance built here.
    name: SDK (generate, build, tests against an instance)
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdk/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated protocol code matches proto/
        run: |
          pnpm run generate
          git diff --exit-code -- src/gen
          test -z "$(git status --porcelain -- src/gen)"
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sdk
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the instance the tests run
        working-directory: .
        run: cargo build --locked -p fuwa-server --bin fuwa
      - name: Tests against the instance
        run: pnpm run test:instance
        env:
          FUWA_BIN: ${{ github.workspace }}/target/debug/fuwa
      # The oldest Node the package supports loads both builds.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Loads on Node 20, as ES modules and CommonJS
        run: |
          node --version
          node -e 'const f = require("@waifu-devs/fuwa"); if (typeof f.Agent !== "function") process.exit(1)'
          node --input-type=module -e 'import { Agent } from "@waifu-devs/fuwa"; if (typeof Agent !== "function") process.exit(1)'

  # The one check to require: it passes when every job this change needed passed.
  passed:
    name: CI passed
    needs: [changes, server, desktop, proto, docker, sdk]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every job this change needed passed."
