name: Release

# Pushing a tag like v0.2.0 makes a GitHub release with the fuwa binary for
# Linux (x86 and ARM), macOS (Apple silicon) and Windows, the desktop app for
# Windows, macOS and Linux, a SHA256SUMS file signed with the release key
# (SHA256SUMS.sig, what desktop apps check before updating themselves), and a
# signed record of the commit and workflow that built each binary. The images for the tag come from
# the Publish image workflow.
#
# To cut one: set the version in server/Cargo.toml, merge it, then
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but server/Cargo.toml says $version. Tag v$version, or change the version first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The same reproducible build as the image (Dockerfile, --target binary), so
  # these are byte for byte the binaries inside ghcr.io/waifu-devs/fuwa:<version>.
  # Built on Debian 12, they need glibc 2.36 or newer (Debian 12, Ubuntu 24.04).
  linux:
    name: Linux (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker: amd64
            runner: ubuntu-latest
          - arch: aarch64
            docker: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: binary
          platforms: linux/${{ matrix.docker }}
          outputs: type=local,dest=out
          build-args: FUWA_COMMIT=${{ github.sha }}
          # Reuses the dependencies the Publish image workflow built.
          cache-from: type=gha,scope=${{ matrix.docker }}
      - run: |
          mkdir dist
          cp out/fuwa "dist/fuwa-$VERSION-${{ matrix.arch }}-linux"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuwa-${{ matrix.arch }}-linux
          path: dist/*

  # macOS and Windows build with cargo directly, with the same toolchain the
  # Dockerfile pins and the web app built in.
  native:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            runner: macos-latest
            file: aarch64-macos
            exe: ""
          - name: Windows (x64)
            runner: windows-latest
            file: x86_64-windows
            exe: .exe
    runs-on: ${{ matrix.runner }}
    env:
      FUWA_COMMIT: ${{ github.sha }}
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      # The version e2ee-wasm/Cargo.toml pins.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm run wasm
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - run: cargo build --release --locked --features web --bin fuwa
      - shell: bash
        run: |
          mkdir dist
          cp "target/release/fuwa${{ matrix.exe }}" "dist/fuwa-$VERSION-${{ matrix.file }}${{ matrix.exe }}"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuwa-${{ matrix.file }}
          path: dist/*

  # The desktop app (desktop/), its own workspace: an installer for each
  # system and the bare program, made by desktop.yml. A desktop build that
  # failed is left out of the release rather than holding the server back.
  desktop:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Make the release
    needs: [version, linux, native, desktop]
    # Linux is what servers run, so it has to be there; a macOS, Windows or
    # desktop build that failed is left out rather than holding the release back.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: fuwa-*
          merge-multiple: true
      - working-directory: dist
        run: sha256sum fuwa-* > SHA256SUMS && cat SHA256SUMS
      # The keys the desktop app trusts, to check the signature below against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          sparse-checkout: desktop/release-keys.txt
          sparse-checkout-cone-mode: false
      # Signs SHA256SUMS with the release key, so the desktop app can trust an
      # update it fetches through any instance (desktop/src/core/updates.rs).
      # The private key exists only in this secret; the app ships the public
      # half (desktop/release-keys.txt), and a key that isn't there fails the
      # release rather than shipping updates no app would install.
      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.FUWA_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::FUWA_RELEASE_SIGNING_KEY isn't set: this release isn't signed, so desktop apps will say it's out but won't install it."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key" "$RUNNER_TEMP/release-key.pub.pem" "$RUNNER_TEMP/SHA256SUMS.bin"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out "$RUNNER_TEMP/SHA256SUMS.bin"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-key.pub.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-key.pub.pem" -rawin -in SHA256SUMS \
            -sigfile "$RUNNER_TEMP/SHA256SUMS.bin"
          public=$(openssl pkey -pubin -in "$RUNNER_TEMP/release-key.pub.pem" -outform DER | tail -c 32 | base64 -w0)
          if ! grep -qxF "$public" ../repo/desktop/release-keys.txt; then
            echo "::error::The signing key's public half ($public) isn't in desktop/release-keys.txt, so no app would trust it."
            exit 1
          fi
          base64 -w0 "$RUNNER_TEMP/SHA256SUMS.bin" > SHA256SUMS.sig
          echo "Signed with $public"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/fuwa-*
      - name: Publish the release
        run: |
          cat > notes.md <<EOF
          Run it with Docker:

          \`\`\`sh
          docker run -d --name fuwa -p 8080:8080 -v fuwa:/data ghcr.io/$REPO:$VERSION
          \`\`\`

          Or download the binary for your machine below. For the desktop app, take the installer for your computer: the \`.deb\` or \`.AppImage\` on Linux, the \`.dmg\` on macOS, or \`-setup.exe\` on Windows (the bare \`fuwa-desktop\` files run without installing). They aren't signed yet, so macOS and Windows ask before the first launch. The [self-hosting guide](https://github.com/$REPO/blob/$GITHUB_REF_NAME/docs/self-hosting.md) walks through both.

          Check a download is an official build:

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS
          gh attestation verify fuwa-$VERSION-x86_64-linux --repo $REPO
          \`\`\`

          \`SHA256SUMS.sig\` is the release key's Ed25519 signature over \`SHA256SUMS\`, which the desktop app checks before it installs an update. The keys are in [desktop/release-keys.txt](https://github.com/$REPO/blob/$GITHUB_REF_NAME/desktop/release-keys.txt); [Release signing](https://github.com/$REPO/blob/$GITHUB_REF_NAME/docs/self-hosting.md#release-signing) shows how to check it by hand.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" --verify-tag \
            --title "fuwa $VERSION" --notes-file notes.md --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
