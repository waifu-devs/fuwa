name: Railway config

# fuwa.chat's Railway project (.railway/railway.ts). A pull request that touches it
# gets a plan comment; merging applies that plan. RAILWAY_TOKEN is a project token
# for the "fuwa" project's production environment.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"
      - "package.json"
      - "package-lock.json"

# Each job gets only what it needs: no OIDC token (the action then posts its
# plan comment as github-actions instead of Railway's bot), and nothing to
# write but the plan job's comment.
permissions:
  contents: read

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The plan comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          # The CLI that gets the token, pinned like the action (and as publish.yml redeploys with).
          cli-version: 5.63.1
      # The CDN and edge rules railway.ts can't declare yet (.railway/edge.mjs): what
      # merging would change. Changes nothing.
      - run: node .railway/edge.mjs check fuwa
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The plan job's artifact, which is what gets applied.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          cli-version: 5.63.1
      # After the config apply, so it never moves the environment under a pinned plan.
      - run: node .railway/edge.mjs apply fuwa
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
