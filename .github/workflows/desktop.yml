name: Desktop installers

# The desktop app (desktop/) for each system, ready to install:
#   Linux    fuwa-desktop-<version>-x86_64-linux.deb and .AppImage
#   macOS    fuwa-desktop-<version>-aarch64-macos.dmg, and the app zipped
#            (.app.zip), which the installed app updates itself from
#   Windows  fuwa-desktop-<version>-x86_64-windows-setup.exe
# and the bare program for each, as before. cargo-packager does the packing,
# from [package.metadata.packager] in desktop/Cargo.toml, which also signs the
# macOS app ad hoc. Neither has a publisher Apple or Microsoft knows, so they
# warn the first time they open (docs/self-hosting.md says what to press).
#
# Release runs this for each tag and attaches what it makes. A pull request
# that changes the packaging or our copy of GPUI (desktop/vendor, whose Metal
# and Direct3D renderers only build on their own systems) runs it too, so a
# broken installer shows up before a release, and it can be started by hand
# from Actions.
on:
  workflow_call:
    inputs:
      version:
        description: The version in the file names.
        type: string
        required: true
  workflow_dispatch:
  pull_request:
    paths:
      - desktop/Cargo.toml
      - desktop/packaging/**
      - desktop/vendor/**
      - .github/workflows/desktop.yml

permissions:
  contents: read

jobs:
  build:
    name: Desktop app, ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            runner: ubuntu-latest
            file: x86_64-linux
            exe: ""
            formats: deb,appimage
          - name: macOS (Apple silicon)
            runner: macos-latest
            file: aarch64-macos
            exe: ""
            formats: app,dmg
          - name: Windows (x64)
            runner: windows-latest
            file: x86_64-windows
            exe: .exe
            formats: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      VERSION: ${{ inputs.version || format('0.0.0-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: What GPUI needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libfuse2t64 libasound2-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # The version is pinned so a new cargo-packager can't change the installers by surprise.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-packager@0.11.8
      # libvpx (VP8 for cameras) is linked in statically. On Linux and macOS
      # shiguredo_libvpx fetches it prebuilt and checks its SHA-256; on Linux
      # it's named for an Ubuntu release, so the one built on 24.04 is picked
      # whatever ubuntu-latest is.
      - name: Which libvpx build
        if: runner.os == 'Linux'
        run: echo "LIBVPX_TARGET=ubuntu-24.04_x86_64" >> "$GITHUB_ENV"
      # Its Windows build is MinGW's, which MSVC can't link, so there it's
      # vcpkg's, static with the C runtime Rust links (-static-md), and the
      # bindings are made from its headers with the runner's LLVM. Which
      # libvpx is packaging/vcpkg/vcpkg.json's builtin-baseline, not
      # whatever ports the runner image came with.
      - name: libvpx from vcpkg
        if: runner.os == 'Windows'
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' packaging/vcpkg/vcpkg.json)
          git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null ||
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin "$baseline"
          installed="$RUNNER_TEMP/vcpkg"
          (cd packaging/vcpkg && vcpkg install --triplet x64-windows-static-md --x-install-root="$installed")
          root="$installed/x64-windows-static-md"
          # env-libvpx-sys links libvpx.lib; vcpkg names it vpx.lib.
          cp "$root/lib/vpx.lib" "$root/lib/libvpx.lib"
          version=$(awk '/^Package: libvpx$/ { found = 1 } found && /^Version: / { print $2; exit }' "$installed/vcpkg/status")
          test -n "$version"
          {
            echo "VPX_LIB_DIR=$root/lib"
            echo "VPX_INCLUDE_DIR=$root/include"
            echo "VPX_VERSION=$version"
            echo "VPX_STATIC=1"
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
          } >> "$GITHUB_ENV"
      - run: cargo build --release --locked --bin fuwa-desktop
      - run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Name them for the release
        run: |
          mkdir dist
          base="fuwa-desktop-$VERSION-${{ matrix.file }}"
          cp "target/release/fuwa-desktop${{ matrix.exe }}" "dist/$base${{ matrix.exe }}"
          shopt -s nullglob
          for f in target/packages/*.deb; do cp "$f" "dist/$base.deb"; done
          for f in target/packages/*.AppImage; do cp "$f" "dist/$base.AppImage"; done
          for f in target/packages/*.dmg; do cp "$f" "dist/$base.dmg"; done
          for f in target/packages/*-setup.exe; do cp "$f" "dist/$base-setup.exe"; done
          # The whole app, signature and all, for apps already installed to
          # swap themselves for (desktop/src/core/updates.rs).
          for f in target/packages/*.app; do ditto -c -k --sequesterRsrc --keepParent "$f" "dist/$base.app.zip"; done
          ls -la dist
          # Each system gets its installer, or this fails.
          case "${{ runner.os }}" in
            Linux) test -f "dist/$base.deb" && test -f "dist/$base.AppImage" ;;
            macOS) test -f "dist/$base.dmg" && test -f "dist/$base.app.zip" ;;
            Windows) test -f "dist/$base-setup.exe" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuwa-desktop-${{ matrix.file }}
          path: desktop/dist/*
