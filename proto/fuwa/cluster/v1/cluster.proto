syntax = "proto3";

package fuwa.cluster.v1;

import "fuwa/v1/admin.proto";
import "fuwa/v1/channel.proto";
import "fuwa/v1/invite.proto";
import "fuwa/v1/media.proto";
import "fuwa/v1/message.proto";
import "fuwa/v1/types.proto";
import "google/protobuf/timestamp.proto";

// How the parts of a split fuwa instance talk to each other. None of this is
// for clients: it runs on the private network between a directory, its shards
// and gateways, and every call carries the cluster key. A single-process
// instance never uses it.

// Run by the directory, which keeps node.db: accounts, sessions, settings,
// uploaded pictures, and which shard holds each community server.
service DirectoryService {
  // Who a session token (or the admin token) belongs to.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  // Whether a session is still signed in, for live streams.
  rpc SessionLive(SessionLiveRequest) returns (SessionLiveResponse);
  // The settings in force now, then again each time an admin changes them.
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  // A shard says which servers it holds, when it starts and whenever it has
  // lost track of what the directory knows.
  rpc RegisterShard(RegisterShardRequest) returns (RegisterShardResponse);
  // Which shard holds each server, and where to reach it.
  rpc Placements(PlacementsRequest) returns (PlacementsResponse);
  // A server's profile changed.
  rpc IndexServer(IndexServerRequest) returns (IndexServerResponse);
  // Someone joined or left a server.
  rpc IndexMembership(IndexMembershipRequest) returns (IndexMembershipResponse);
  // An invite was made, or stopped working.
  rpc IndexInvite(IndexInviteRequest) returns (IndexInviteResponse);
  // A server was deleted.
  rpc DropServer(DropServerRequest) returns (DropServerResponse);
  // Notification settings that point at a deleted server or channel, or a
  // member who left.
  rpc ForgetNotifications(ForgetNotificationsRequest) returns (ForgetNotificationsResponse);
  // Checks a picture link about to be set.
  rpc CheckPicture(CheckPictureRequest) returns (CheckPictureResponse);
  // Marks a checked picture as used.
  rpc KeepPicture(KeepPictureRequest) returns (KeepPictureResponse);
  // Deletes the server icon or emoji a change replaced.
  rpc DropPicture(DropPictureRequest) returns (DropPictureResponse);
  // Sends a server's picture (its icon, an emoji, a webhook's picture) to
  // the shard holding the server, which keeps it from then on, piece by
  // piece and checked by SHA-256. See docs/regions.md.
  rpc SendPicture(SendPictureRequest) returns (stream SendPictureResponse);
  // The shard holding the server has the picture now: the directory's copy
  // (and its replica's) goes, and its link leads to the shard.
  rpc ForgetPicture(ForgetPictureRequest) returns (ForgetPictureResponse);
  // A server's pictures the directory still keeps, for its shard to take.
  rpc ServerPictures(ServerPicturesRequest) returns (ServerPicturesResponse);
  // Uses up an upload link for a server's picture, whose bytes the shard
  // holding the server receives and keeps.
  rpc StartServerUpload(StartServerUploadRequest) returns (StartServerUploadResponse);
  // The shard has a server picture's bytes (or they didn't arrive).
  rpc FinishServerUpload(FinishServerUploadRequest) returns (FinishServerUploadResponse);
  // How many servers an account owns, for the cap on that.
  rpc CountOwnedServers(CountOwnedServersRequest) returns (CountOwnedServersResponse);
  // An agent by username, for adding it to a server.
  rpc FindAgent(FindAgentRequest) returns (FindAgentResponse);
  // For a secure channel: the device the calling session registered, and the
  // signed-in devices of the people who may be in the channel.
  rpc SecureDevices(SecureDevicesRequest) returns (SecureDevicesResponse);
  // The server files the directory's data folder still holds from when the
  // instance ran as one process, sent to a starting shard: the first shard
  // to ask gets them all, and nothing goes to any other. Empty when there are
  // none (or they're promised to another shard).
  rpc TakeServers(TakeServersRequest) returns (stream TakeServersResponse);
  // The shard has a checked copy of the files TakeServers sent; the
  // directory moves its own out of the way, to handed-over/.
  rpc HandedOver(HandedOverRequest) returns (HandedOverResponse);
  // Passes a call between the two ends of a shared channel on to the shard
  // holding the server it's for.
  rpc PassShared(PassSharedRequest) returns (PassSharedResponse);
}

// Run by each shard, which keeps some of the servers' files.
service ShardService {
  // Makes a new server on this shard.
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  // Copies someone's new profile into the servers they're in.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // An account was deleted: takes it out of every server on this shard it was
  // ever in, leaving a placeholder name behind.
  rpc ForgetAccount(ForgetAccountRequest) returns (ForgetAccountResponse);
  // An account's part of a data export: every server on this shard it was
  // ever in, with the messages it wrote, as JSON.
  rpc ExportAccount(ExportAccountRequest) returns (stream ExportAccountResponse);
  // What admins and the usage signal see about each server on this shard.
  rpc DescribeServers(DescribeServersRequest) returns (DescribeServersResponse);
  // Whether a server has a channel, before notification settings point at it.
  rpc ChannelExists(ChannelExistsRequest) returns (ChannelExistsResponse);
  // Where an invite leads, for the directory's GetInvite.
  rpc DescribeInvite(DescribeInviteRequest) returns (DescribeInviteResponse);
  // A call from the other end of a shared channel, for one of this shard's
  // servers: a guest server's people reading and writing in the home's
  // channel, or the home telling a guest what changed.
  rpc Shared(SharedRequest) returns (SharedResponse);

  // Moving a server to another shard (and so maybe another region), run by
  // the directory: it asks the new shard to AdoptServer, which takes the
  // server's files from the old one with SendServer, then tells the old one
  // to ReleaseServer. See docs/regions.md.

  // Sends a server's files (its database, then its recordings and pictures), each
  // checked by SHA-256. From the first piece on, the server takes no more
  // changes here until ReleaseServer.
  rpc SendServer(SendServerRequest) returns (stream SendServerResponse);
  // Takes a server from the shard at `from_url`, opens it here and starts
  // replicating it. Answers once it's ready for clients.
  rpc AdoptServer(AdoptServerRequest) returns (AdoptServerResponse);
  // Ends a move for this shard: lets go of the server (deleting its files
  // here and this shard's replica of it), or keeps it and takes changes again.
  rpc ReleaseServer(ReleaseServerRequest) returns (ReleaseServerResponse);
}

// Run by each media part, which carries calls' sound (WebRTC). The parts
// that keep who's in each call (shards for voice channels, the directory for
// direct-message calls) open and close people's connections here. Every
// call goes to one media part, picked from the call's room name, so everyone
// in it meets on the same one.
service MediaService {
  // Takes someone's WebRTC offer for a room and answers it. Someone already
  // in the room under the same name is replaced (their app hears so).
  rpc Open(OpenRequest) returns (OpenResponse);
  // Hangs someone up, or everyone in a room.
  rpc Close(CloseRequest) returns (CloseResponse);
  // Changes whether someone is heard and hears others.
  rpc Update(UpdateRequest) returns (UpdateResponse);
  // Puts a program in a room without WebRTC, for as long as the stream is
  // open: it gets each person's frames of sound, and ends with why.
  rpc Bridge(BridgeRequest) returns (stream BridgeResponse);
  // Queues frames of sound for a bridge to say.
  rpc Speak(SpeakRequest) returns (SpeakResponse);
}

message BridgeRequest {
  string room = 1;
  string participant = 2;
  string session_id = 3;
  bool may_speak = 4;
  bool may_hear = 5;
}

message BridgeResponse {
  oneof event {
    HeardFrame frame = 1;
    // "replaced", "restarting" or "closed". A stream that ends without it
    // was cut off: open it again.
    string ended = 2;
  }
}

message HeardFrame {
  string participant = 1;
  bytes frame = 2;
  uint32 timestamp = 3;
}

message SpeakRequest {
  string room = 1;
  string participant = 2;
  string session_id = 3;
  repeated bytes frames = 4;
}

message SpeakResponse {
  uint32 queued = 1;
}

message OpenRequest {
  // Such as "s/<server>/<channel>" or "d/<conversation>".
  string room = 1;
  // The account; one connection per account per room.
  string participant = 2;
  string session_id = 3;
  string offer = 4;
  bool may_speak = 5;
  bool may_hear = 6;
  // Whether their camera's frames are passed on.
  bool may_video = 7;
  // Whether their shared screen's frames are passed on.
  bool may_screen = 8;
}

message OpenResponse {
  string answer = 1;
}

message CloseRequest {
  string room = 1;
  // Empty: everyone in the room.
  string participant = 2;
  // Only if it's still this session; empty for whichever.
  string session_id = 3;
}

message CloseResponse {}

message UpdateRequest {
  string room = 1;
  string participant = 2;
  bool may_speak = 3;
  bool may_hear = 4;
  // Only if it's still this session; empty for whichever.
  string session_id = 5;
  bool may_video = 6;
  bool may_screen = 7;
}

message UpdateResponse {
  // Whether that participant (and session) has a connection there.
  bool connected = 1;
}

// An account as the directory knows it.
message Account {
  string id = 1;
  fuwa.v1.AccountKind kind = 2;
  string username = 3;
  string display_name = 4;
  string avatar_url = 5;
  bool admin = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  string status = 9;
  google.protobuf.Timestamp status_expires_at = 10;
  bool two_factor = 11;
  bool disabled = 12;
  // Whether it signs in with a password.
  bool has_password = 13;
}

message AuthenticateRequest {
  string token = 1;
}

message AuthenticateResponse {
  // Unset for the operator's admin token.
  Account account = 1;
  // The session's token hash; empty for the admin token.
  string token_hash = 2;
}

message SessionLiveRequest {
  string token_hash = 1;
}

message SessionLiveResponse {
  bool live = 1;
}

message WatchRequest {
  // Set by shards, so the directory knows which are up.
  string shard_id = 1;
}

message WatchResponse {
  fuwa.v1.InstanceSettings settings = 1;
  // The moderation providers with their API keys, which settings leaves out
  // and shards need to check messages.
  repeated fuwa.v1.AutoModProviderSettings automod_providers = 2;
  // Accounts some of whose sessions just ended, sent on their own (without
  // settings) so live streams on shards and gateways check theirs at once.
  repeated string sessions_ended = 3;
  // Someone joined, or was added to, a server, sent to gateways on their own
  // so streams that follow new servers pick it up at once.
  repeated MembershipJoined joined = 4;
}

message MembershipJoined {
  string account_id = 1;
  string server_id = 2;
}

// A server as a shard reports it: its profile and who's in it.
message ServerEntry {
  fuwa.v1.Server server = 1;
  repeated string member_ids = 2;
  // The codes of the server's invites.
  repeated string invite_codes = 3;
}

message RegisterShardRequest {
  string shard_id = 1;
  // How the directory and gateways reach this shard.
  string url = 2;
  // Every server the shard holds. Servers the directory had on this shard and
  // that aren't here are gone.
  repeated ServerEntry servers = 3;
  // The shard's FUWA_REGION; empty for the instance's home region.
  string region = 4;
  // Its FUWA_REGION_NAME, if set.
  string region_name = 5;
}

message RegisterShardResponse {
  // Servers this shard still has that moved to another shard: it lets go of
  // them (as ReleaseServer without keep).
  repeated string moved_away = 1;
  // Servers still being moved off this shard. Any other it has stopped
  // taking changes to for a move takes them again.
  repeated string moving = 2;
}

message PlacementsRequest {
  repeated string server_ids = 1;
}

message Placement {
  string server_id = 1;
  string shard_id = 2;
  // Empty while the shard isn't up.
  string url = 3;
}

message PlacementsResponse {
  // Servers that don't exist are left out.
  repeated Placement placements = 1;
}

message IndexServerRequest {
  fuwa.v1.Server server = 1;
}

message IndexServerResponse {}

message IndexMembershipRequest {
  string server_id = 1;
  string account_id = 2;
  // True for a join, false for leaving.
  bool joined = 3;
}

message IndexMembershipResponse {}

message IndexInviteRequest {
  string server_id = 1;
  string code = 2;
  // True for a new invite, false for one deleted, used up or expired.
  bool exists = 3;
}

message IndexInviteResponse {}

message DropServerRequest {
  string server_id = 1;
}

message DropServerResponse {}

message ForgetNotificationsRequest {
  string server_id = 1;
  // Only this channel's settings, when set.
  string channel_id = 2;
  // Only this account's settings, when set.
  string account_id = 3;
}

message ForgetNotificationsResponse {}

message CheckPictureRequest {
  string account_id = 1;
  fuwa.v1.MediaPurpose purpose = 2;
  string url = 3;
  // The server it's for, if it's one of a server's pictures.
  string server_id = 4;
}

message CheckPictureResponse {
  // The picture's id when the link is to one of this instance's uploads.
  string media_id = 1;
  // Its size in bytes, and its type.
  int64 size = 2;
  string content_type = 3;
}

message KeepPictureRequest {
  string media_id = 1;
  string server_id = 2;
}

message KeepPictureResponse {}

message DropPictureRequest {
  string old_url = 1;
  string new_url = 2;
  string server_id = 3;
}

message DropPictureResponse {}

message SendPictureRequest {
  string media_id = 1;
  string server_id = 2;
}

// A piece of the picture, in order.
message SendPictureResponse {
  bytes data = 1;
  // Set on the last piece (which may have no data): the SHA-256 of the
  // whole file.
  bytes sha256 = 2;
}

message ForgetPictureRequest {
  string media_id = 1;
  string server_id = 2;
}

message ForgetPictureResponse {}

message ServerPicturesRequest {
  string server_id = 1;
}

message ServerPicturesResponse {
  repeated string media_ids = 1;
}

message StartServerUploadRequest {
  // The SHA-256 of the upload link's token, as node.db keeps it.
  string upload_hash = 1;
  string server_id = 2;
}

message StartServerUploadResponse {
  string media_id = 1;
  // The size it was said to be, in bytes.
  int64 size = 2;
}

message FinishServerUploadRequest {
  string media_id = 1;
  string server_id = 2;
  // What the bytes turned out to be, and their size as kept; empty when they
  // didn't arrive whole (the upload is then dropped).
  string content_type = 3;
  int64 size = 4;
}

message FinishServerUploadResponse {}

message CountOwnedServersRequest {
  string account_id = 1;
}

message CountOwnedServersResponse {
  int64 count = 1;
}

message FindAgentRequest {
  string username = 1;
}

message FindAgentResponse {
  // Unset when there's no agent by that name, or it's turned off.
  Account agent = 1;
  string owner_id = 2;
  bool public = 3;
}

message SecureDevicesRequest {
  string token_hash = 1;
  repeated string account_ids = 2;
}

message SecureDevicesResponse {
  // Empty when the session registered no device.
  string caller_device_id = 1;
  repeated SecureDevice devices = 2;
}

message SecureDevice {
  string id = 1;
  string account_id = 2;
}

message TakeServersRequest {
  string shard_id = 1;
}

// A piece of one file. A file's pieces come in order, one file after another.
message TakeServersResponse {
  // The file's name in servers/: `<server id>.db`, or one of the files kept
  // beside it (`-log`, `-wal`, `-shm`).
  string name = 1;
  bytes data = 2;
  // Set on a file's last piece (which may have no data): the SHA-256 of the
  // whole file, to check the copy against.
  bytes sha256 = 3;
}

message HandedOverRequest {
  string shard_id = 1;
  // The files the shard now has, by name.
  repeated string names = 2;
}

message HandedOverResponse {}

message CreateServerRequest {
  fuwa.v1.User owner = 1;
  string name = 2;
  string description = 3;
  string icon_url = 4;
  bool discoverable = 5;
}

message CreateServerResponse {
  fuwa.v1.Server server = 1;
}

message UpdateUserRequest {
  fuwa.v1.User user = 1;
  repeated string server_ids = 2;
}

message UpdateUserResponse {}

message ForgetAccountRequest {
  string account_id = 1;
  // How the account shows from now on.
  fuwa.v1.User placeholder = 2;
}

message ForgetAccountResponse {
  // Servers the account was still a member of.
  repeated string left_server_ids = 1;
}

message ExportAccountRequest {
  string account_id = 1;
}

message ExportAccountResponse {
  // The next piece of JSON.
  bytes chunk = 1;
  // This piece starts a new server's object.
  bool starts_server = 2;
}

message DescribeServersRequest {
  // Empty for every server on the shard.
  repeated string server_ids = 1;
}

message ServerDescription {
  fuwa.v1.Server server = 1;
  fuwa.v1.ServerUsage usage = 2;
  // The server's own caps, before the instance's defaults.
  fuwa.v1.ServerLimits own_limits = 3;
  // The owner as the server last saw them.
  fuwa.v1.User owner = 4;
}

message DescribeServersResponse {
  repeated ServerDescription servers = 1;
}

message ChannelExistsRequest {
  string server_id = 1;
  string channel_id = 2;
}

message ChannelExistsResponse {
  bool exists = 1;
}

message SendServerRequest {
  string server_id = 1;
}

// A piece of one file. A file's pieces come in order, one file after another.
message SendServerResponse {
  // Where it goes, from the data folder: `servers/<id>.db` (or a file kept
  // beside it), `recordings/<id>/<recording>/<file>`, or a picture the
  // server keeps, `server-pictures/<id>/<picture>`.
  string path = 1;
  bytes data = 2;
  // Set on a file's last piece (which may have no data): the SHA-256 of the
  // whole file.
  bytes sha256 = 3;
}

message AdoptServerRequest {
  string server_id = 1;
  // Where the shard holding it now is.
  string from_url = 2;
}

message AdoptServerResponse {
  ServerEntry entry = 1;
}

message ReleaseServerRequest {
  string server_id = 1;
  // True to keep it (the move didn't happen), false to let go of it.
  bool keep = 2;
}

message ReleaseServerResponse {}

message DescribeInviteRequest {
  string server_id = 1;
  string code = 2;
}

message DescribeInviteResponse {
  fuwa.v1.GetInviteResponse invite = 1;
}

message PassSharedRequest {
  SharedCall call = 1;
}

message PassSharedResponse {
  SharedReply reply = 1;
}

message SharedRequest {
  SharedCall call = 1;
}

message SharedResponse {
  SharedReply reply = 1;
}

// Between the servers at the two ends of a shared channel. Shards only trust
// each other's word through the cluster key: the guest's shard has checked
// what its people may do in the guest server, and the home's shard checks
// the rest (the connection, what it allows, blocks, slow mode, AutoMod).
message SharedCall {
  // The server it's for: the home, or a guest.
  string server_id = 1;
  oneof call {
    // To the home.
    ShareLookup lookup = 2;
    ShareAsk ask = 3;
    GuestSend send = 4;
    GuestList list = 5;
    GuestGet get = 6;
    GuestEdit edit = 7;
    GuestDelete delete = 8;
    // The guest ended the connection, or withdrew its request.
    GuestLeft left = 9;
    // To a guest.
    HomeApproved approved = 10;
    // The home ended the connection: turned the request down, disconnected,
    // or deleted the channel or itself.
    HomeEnded ended = 11;
    // What just happened in the channel, for the guest's people to see live.
    HomeEvents events = 12;
    // What the guest's people may do changed.
    HomeUpdated updated = 13;
    // To the home: who its AutoMod sends the channel's messages to.
    GuestReaders readers = 14;
    // From an instance admin, to the server either end: its connections, or
    // ending one.
    AdminShares admin_list = 15;
    AdminEnd admin_end = 16;
  }
  // Set only by the instance that received the call from another instance
  // (whatever the other instance sent there): that instance's origin and
  // its key's fingerprint. Empty for calls made inside this instance.
  string from_instance = 17;
  string from_fingerprint = 18;
}

message SharedReply {
  fuwa.v1.PreviewShareResponse preview = 1;
  fuwa.v1.SharedConnection connection = 2;
  fuwa.v1.Message message = 3;
  fuwa.v1.ListMessagesResponse page = 4;
  fuwa.v1.User author = 5;
  // For GuestReaders: as in PreviewShareResponse.checked_by.
  repeated string checked_by = 6;
  // For AdminShares.
  repeated fuwa.v1.SharedConnection connections = 7;
}

message AdminShares {}

message AdminEnd {
  string connection_id = 1;
  // The instance admin's account; empty for the operator's admin token.
  string actor_id = 2;
}

// A guest server's admins reading their Shared channels page.
message GuestReaders {
  string connection_id = 1;
  string guest_server_id = 2;
}

// Someone in a guest server, acting in the channel it shows.
message Guest {
  string connection_id = 1;
  fuwa.v1.User user = 2;
  // Their server as it is now.
  fuwa.v1.SharedServer server = 3;
  // They can manage messages in the guest's channel: they may delete
  // messages the guest server's people wrote.
  bool moderator = 4;
}

message ShareLookup {
  string code = 1;
  // The server that would show it.
  string guest_server_id = 2;
}

message ShareAsk {
  string code = 1;
  // The connection's id, made by the guest.
  string connection_id = 2;
  fuwa.v1.SharedServer guest = 3;
  string asked_by_id = 4;
}

message GuestSend {
  Guest guest = 1;
  string content = 2;
  repeated fuwa.v1.Attachment attachments = 3;
  repeated fuwa.v1.Embed embeds = 4;
  string reply_to_id = 5;
}

message GuestList {
  Guest guest = 1;
  int32 limit = 2;
  string before_id = 3;
  string after_id = 4;
}

message GuestGet {
  Guest guest = 1;
  string message_id = 2;
}

message GuestEdit {
  Guest guest = 1;
  string message_id = 2;
  string content = 3;
}

message GuestDelete {
  Guest guest = 1;
  string message_id = 2;
}

message GuestLeft {
  string connection_id = 1;
  string guest_server_id = 2;
  string actor_id = 3;
}

message HomeApproved {
  fuwa.v1.SharedConnection connection = 1;
  string actor_id = 2;
}

message HomeEnded {
  string connection_id = 1;
  string actor_id = 2;
}

message HomeEvents {
  string connection_id = 1;
  repeated fuwa.v1.Event events = 2;
}

message HomeUpdated {
  fuwa.v1.SharedConnection connection = 1;
}
