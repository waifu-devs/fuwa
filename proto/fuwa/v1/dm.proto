syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/call.proto";
import "fuwa/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Direct messages: conversations between two people, end-to-end encrypted
// with MLS (RFC 9420). The instance delivers them but can't read them.
//
// Every signed-in device that uses them registers a signing key of its own
// (RegisterDevice) and keeps some MLS key packages here, so others can add
// it. A conversation is an MLS group of every device of both people, whose
// group id is the conversation's id. The instance keeps each conversation's
// records (commits that change who's in it, and encrypted messages) in one
// order, takes a record only for the group's current epoch (so devices
// never fork it), and keeps the group's latest group info so a device can
// join by itself. It never sees a key that opens a message. See
// docs/e2ee.md for the whole design.
service DirectMessageService {
  // Registers the calling device's signing key, with key packages for it.
  // A session has one device: registering a new key replaces the old one.
  // Signing the session out removes its device.
  rpc RegisterDevice(RegisterDeviceRequest) returns (RegisterDeviceResponse);
  // Adds single-use key packages for the calling device.
  rpc AddKeyPackages(AddKeyPackagesRequest) returns (AddKeyPackagesResponse);
  // The devices of people: yourself, anyone you have a conversation with,
  // or anyone you could open one with.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // Takes one key package per device, to add the devices to a conversation.
  // Each is handed out once; once a device has none left, its last-resort
  // key package is handed out instead. Only for devices of people you have
  // a conversation with or share a server with (secure channels add them
  // too), and your own. From people you have no conversation with, an
  // account gets a limited number of single-use key packages an hour, and
  // their last-resort ones past that.
  rpc ClaimKeyPackages(ClaimKeyPackagesRequest) returns (ClaimKeyPackagesResponse);

  // The conversation with someone: the one you already have, or a new one.
  // A new one takes someone who shares a server with you.
  rpc OpenConversation(OpenConversationRequest) returns (OpenConversationResponse);
  // Every conversation you're in, the latest first.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  // The group as the last commit left it, for joining by yourself.
  rpc GetGroupInfo(GetGroupInfoRequest) returns (GetGroupInfoResponse);
  // A conversation's records, oldest first.
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  // Welcomes for the calling device: conversations it was added to.
  rpc ListWelcomes(ListWelcomesRequest) returns (ListWelcomesResponse);
  // Adds a commit. It must be for the conversation's current epoch, which it
  // then moves on; a commit for an older one fails with FAILED_PRECONDITION:
  // catch up and try again.
  rpc PostCommit(PostCommitRequest) returns (PostCommitResponse);
  // Adds an encrypted message, for the current epoch like a commit.
  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse);
  // Deletes a record you sent: its ciphertext goes, a gap stays, and so do
  // the sealed files it carried.
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);
  // Pins a message record in a conversation, or unpins it. Either person in
  // it may, while they may write there. The instance learns only which record
  // is pinned and when, never what it says or who pinned it: apps draw it from
  // their own copy. At most
  // InstanceSettings.pins_per_conversation pins in each conversation.
  rpc PinRecord(PinRecordRequest) returns (PinRecordResponse);
  // A conversation's pins, the latest first.
  rpc ListPins(ListDmPinsRequest) returns (ListDmPinsResponse);
  // Reserves a place for a sealed file: something a message carries that's
  // too big to go in it, such as a voice message, encrypted on the device
  // under a key that travels only inside the message. Upload it like a
  // picture (MediaService.CreateUpload has how), then name its id in
  // PostMessage's media_ids, which keeps it for as long as the message.
  // The instance takes any bytes and never opens them.
  rpc CreateSealedUpload(CreateSealedUploadRequest) returns (CreateSealedUploadResponse);
  // The instance's caps on voice messages, for the recorder to stop at.
  rpc GetVoiceLimits(GetVoiceLimitsRequest) returns (GetVoiceLimitsResponse);
  // Live changes to your conversations. The stream says `ready` once it's
  // listening; anything from before then, read with ListConversations and
  // ListRecords. A response with nothing set is a heartbeat.
  rpc Watch(WatchRequest) returns (stream WatchResponse);

  // Message backup: what the account's devices read here and in secure
  // channels, encrypted on the device with a recovery key the instance never
  // sees, kept as parts in order so a new device can read what came before
  // it. See docs/e2ee.md.
  //
  // Whether the account has one, and its key check.
  rpc GetBackup(GetBackupRequest) returns (GetBackupResponse);
  // Starts a backup with a new recovery key. One the account already has is
  // only replaced (its parts deleted) when the request says so.
  rpc StartBackup(StartBackupRequest) returns (StartBackupResponse);
  // Adds a part at the backup's next place. Refused with FAILED_PRECONDITION
  // if the key check isn't the backup's current one (another device started
  // it over), ALREADY_EXISTS if that place was taken (get the backup and seal
  // the part again for the next one), RESOURCE_EXHAUSTED if it's full.
  rpc AddBackupPart(AddBackupPartRequest) returns (AddBackupPartResponse);
  // Parts after a sequence, oldest first.
  rpc ListBackupParts(ListBackupPartsRequest) returns (ListBackupPartsResponse);
  // Deletes the backup and every part of it.
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
}

// A device that takes part in encrypted conversations: one per signed-in
// session that uses them. Only its public key is kept here.
message Device {
  // The first 16 bytes of the SHA-256 of signature_key, as hex, so anyone
  // can check which key a device id stands for.
  string id = 1;
  string user_id = 2;
  // The Ed25519 key it signs everything it sends with, as in its MLS credential.
  bytes signature_key = 3;
  // The device it's on, as its User-Agent said, for telling devices apart.
  string label = 4;
  google.protobuf.Timestamp created_at = 5;
}

message RegisterDeviceRequest {
  // Ed25519, 32 bytes.
  bytes signature_key = 1;
  // MLS key packages (each an MLSMessage) for this key and the caller's
  // account, each good for being added once. Up to 100.
  repeated bytes key_packages = 2;
  // A key package marked last resort, handed out when the others run out.
  // Replaces the one kept before.
  bytes last_resort_key_package = 3;
}

message RegisterDeviceResponse {
  Device device = 1;
  // Single-use key packages kept for it now.
  int32 key_packages = 2;
}

message AddKeyPackagesRequest {
  repeated bytes key_packages = 1;
}

message AddKeyPackagesResponse {
  int32 key_packages = 1;
}

message ListDevicesRequest {
  repeated string user_ids = 1;
}

message ListDevicesResponse {
  // Devices signed in now, oldest first.
  repeated Device devices = 1;
}

message ClaimKeyPackagesRequest {
  repeated string device_ids = 1;
}

message ClaimKeyPackagesResponse {
  // One per device that has one. Devices that registered no last-resort key
  // package and ran out are left out.
  repeated ClaimedKeyPackage key_packages = 1;
}

message ClaimedKeyPackage {
  string device_id = 1;
  bytes key_package = 2;
}

// A conversation between two people.
message Conversation {
  // Also its MLS group id (as UTF-8).
  string id = 1;
  // Both people, the caller among them. Someone whose account was deleted
  // shows as "Deleted account", as in servers.
  repeated User users = 2;
  // The epoch the next record must be in. Zero until the first commit.
  int64 epoch = 3;
  // The latest record's sequence; zero before any.
  int64 last_sequence = 4;
  google.protobuf.Timestamp created_at = 5;
  // When the latest record came, for putting conversations in order.
  google.protobuf.Timestamp updated_at = 6;
}

message OpenConversationRequest {
  string user_id = 1;
}

message OpenConversationResponse {
  Conversation conversation = 1;
  // Whether this call started it.
  bool created = 2;
}

message ListConversationsRequest {}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

message GetGroupInfoRequest {
  string conversation_id = 1;
}

message GetGroupInfoResponse {
  // The epoch it describes. Zero, with no group info, before the first commit.
  int64 epoch = 1;
  // An MLSMessage carrying a GroupInfo, with the ratchet tree.
  bytes group_info = 2;
}

enum ConversationRecordKind {
  CONVERSATION_RECORD_KIND_UNSPECIFIED = 0;
  // Changes who's in the conversation and moves it to the next epoch.
  CONVERSATION_RECORD_KIND_COMMIT = 1;
  // An encrypted message.
  CONVERSATION_RECORD_KIND_MESSAGE = 2;
}

// One entry in a conversation's log. Devices read them in order.
message ConversationRecord {
  string conversation_id = 1;
  // Its place in the conversation: 1, 2, 3...
  int64 sequence = 2;
  ConversationRecordKind kind = 3;
  // The epoch it was made in.
  int64 epoch = 4;
  // Who sent it, as the instance knows (the record itself says, signed).
  string sender_id = 5;
  string sender_device_id = 6;
  // The MLS message. Empty once deleted.
  bytes data = 7;
  google.protobuf.Timestamp created_at = 8;
  // When its sender deleted it.
  google.protobuf.Timestamp deleted_at = 9;
}

message ListRecordsRequest {
  string conversation_id = 1;
  int64 after_sequence = 2;
  // 1 to 500; defaults to 100.
  int32 limit = 3;
}

message ListRecordsResponse {
  repeated ConversationRecord records = 1;
  bool has_more = 2;
}

message ListWelcomesRequest {}

message ListWelcomesResponse {
  repeated ConversationWelcome welcomes = 1;
}

// A device was added to a conversation: what it joins with.
message ConversationWelcome {
  string conversation_id = 1;
  // The commit that added it: the device reads the records after it.
  int64 sequence = 2;
  // An MLSMessage carrying a Welcome.
  bytes data = 3;
}

message PostCommitRequest {
  string conversation_id = 1;
  // An MLSMessage carrying the commit, for the conversation's current epoch.
  bytes commit = 2;
  // The group as the commit leaves it, with its ratchet tree.
  bytes group_info = 3;
  // For the devices the commit adds, named in welcome_device_ids.
  bytes welcome = 4;
  repeated string welcome_device_ids = 5;
}

message PostCommitResponse {
  ConversationRecord record = 1;
}

message PostMessageRequest {
  string conversation_id = 1;
  // An MLSMessage carrying an encrypted application message.
  bytes message = 2;
  // Sealed files the message carries (CreateSealedUpload), at most 10: your
  // own uploads, stored and not carried by another message yet. They're
  // deleted with the message.
  repeated string media_ids = 3;
}

message PostMessageResponse {
  ConversationRecord record = 1;
}

message DeleteRecordRequest {
  string conversation_id = 1;
  int64 sequence = 2;
}

message DeleteRecordResponse {}

message CreateSealedUploadRequest {
  // The conversation the file is for.
  string conversation_id = 1;
  // The sealed file's exact size in bytes. Every sealed file counts toward
  // the instance's attachment_upload_bytes_per_day; a voice message is also
  // capped by voice_message_bytes and counted in voice_message_bytes_per_day,
  // and any other file is capped by attachment_upload_bytes.
  int64 size = 2;
  // What it is. The instance can't check (it can't open it), which is why
  // every kind counts toward the attachment caps.
  SealedKind kind = 3;
}

enum SealedKind {
  // A voice message, as apps from before files sent them.
  SEALED_KIND_UNSPECIFIED = 0;
  SEALED_KIND_VOICE = 1;
  // Any other file (DirectMessageText.files).
  SEALED_KIND_FILE = 2;
}

message CreateSealedUploadResponse {
  // Where to PUT the bytes. Works once, until `expires_at`.
  string upload_url = 1;
  google.protobuf.Timestamp expires_at = 2;
  // Its id, for media_ids, and where it's served (as
  // application/octet-stream, to anyone with the link: it's ciphertext).
  string media_id = 3;
  string url = 4;
}

message GetVoiceLimitsRequest {}

message GetVoiceLimitsResponse {
  // The longest voice message, in seconds; unset for no cap.
  optional int64 max_seconds = 1;
  // The biggest sealed voice message, in bytes; unset for no cap.
  optional int64 max_bytes = 2;
}

message WatchRequest {}

message WatchResponse {
  // The stream is listening: everything from now on comes through it.
  bool ready = 1;
  DirectMessageEvent event = 2;
}

// Something that changed in one of your conversations.
message DirectMessageEvent {
  oneof payload {
    // A conversation you're in was opened.
    Conversation conversation_opened = 1;
    ConversationRecord record_added = 2;
    // Without its data.
    ConversationRecord record_deleted = 3;
    // Someone joined or left the conversation's call, or muted. An empty
    // call means it ended.
    DmCall call_updated = 4;
    // A record was pinned or unpinned.
    DmPinUpdated pin_updated = 5;
  }
}

// A pinned record in a conversation.
// A pinned record. The instance keeps which record is pinned and when, never
// what it says or who pinned it; an app that wants to say who pinned it
// sends that inside the conversation, encrypted.
message DmPin {
  string conversation_id = 1;
  int64 sequence = 2;
  google.protobuf.Timestamp pinned_at = 3;
}

message DmPinUpdated {
  DmPin pin = 1;
  // False when it was unpinned.
  bool pinned = 2;
}

message PinRecordRequest {
  string conversation_id = 1;
  int64 sequence = 2;
  // False unpins it.
  bool pinned = 3;
}

message PinRecordResponse {
  // Unset after unpinning.
  DmPin pin = 1;
}

message ListDmPinsRequest {
  string conversation_id = 1;
  // 1 to 100; 50 when unset.
  int32 limit = 2;
  // The next page: the pins made before this pinned record's.
  optional int64 after_sequence = 3;
}

message ListDmPinsResponse {
  // Latest first.
  repeated DmPin pins = 1;
  bool has_more = 2;
}

// What a direct message says: the plaintext inside an encrypted record,
// which only the conversation's devices ever see. The instance never does,
// so these fields are for the apps alone.
message DirectMessageContent {
  oneof body {
    DirectMessageText text = 1;
    DirectMessageEdit edit = 2;
    // A secure channel's text or edit, signed by the sending device so it can
    // be checked again later, after it was passed on as shared history.
    SignedContent signed = 3;
    // A secure channel's earlier messages, for devices that joined after
    // them (only while the channel shares history).
    SharedHistory history = 4;
    // A moderator locking or unlocking a thread in a secure channel; sent
    // signed (inside `signed`), like a text.
    ThreadChange thread = 6;
    // A recorded voice message (direct messages only, for now).
    DirectMessageVoice voice = 5;
  }
}

// What the sender's device signed (fuwa_e2ee's Device::sign) and the
// signature. Whoever opens it checks it with the signature key of the device
// MLS says sent it.
message SignedContent {
  // A SignedPayload.
  bytes payload = 1;
  bytes signature = 2;
}

message SignedPayload {
  // The secure channel it was sent in.
  string conversation_id = 1;
  string sender_id = 2;
  // Unix milliseconds, by the sender's clock.
  int64 sent_at_ms = 3;
  // A text or an edit.
  DirectMessageContent content = 4;
}

// Messages a device passes on to devices added after them, each as its
// sender's device signed it. Checked one by one: a device that shares
// history can leave messages out, but can't change or make one up.
message SharedHistory {
  repeated SharedEntry entries = 1;
}

message SharedEntry {
  // Where it was in the channel (an edit gives its message's).
  int64 sequence = 1;
  // A SignedPayload, and its signature.
  bytes payload = 2;
  bytes signature = 3;
  // The signature key of the device that signed it.
  bytes signature_key = 4;
}

message DirectMessageText {
  // Markdown, up to 4000 characters.
  string content = 1;
  // The record it answers, if any.
  int64 reply_to_sequence = 2;
  // In a secure channel: the record of the message it replies under, as a
  // thread (docs/threads.md), or 0. Only the channel's devices see it; the
  // server can't tell a thread reply from any other line.
  int64 thread_sequence = 3;
  // A thread reply its author also sent to the channel.
  bool in_channel = 4;
  // Files sent with it (up to 10), each sealed on the sender's device: their
  // names, kinds and keys travel only in here. The text may be empty then.
  repeated SealedFile files = 5;
}

// Locks or unlocks the thread under a secure channel's message. Devices take
// it only from someone with Manage Messages in the channel, by their own view
// of the channel's permissions; the latest one wins.
message ThreadChange {
  int64 parent_sequence = 1;
  bool locked = 2;
}

// New text for one of the sender's own earlier messages.
message DirectMessageEdit {
  int64 sequence = 1;
  string content = 2;
}

// A voice message: Ogg Opus, sealed as a SealedFile. What it sounds like
// and its waveform travel only in here, inside the encryption.
message DirectMessageVoice {
  SealedFile file = 1;
  // How long it plays, in milliseconds.
  uint32 duration_ms = 2;
  // Its loudness over time, worked out on the sender's device: up to 128
  // values, 0 (silence) to 255 (loudest), evenly spread over the clip.
  bytes waveform = 3;
  // The record it answers, if any.
  int64 reply_to_sequence = 4;
}

// A file kept on the instance as ciphertext (CreateSealedUpload). Only the
// devices that read the message holding this ever have its key.
message SealedFile {
  // The upload's id, and where it's fetched from.
  string media_id = 1;
  string url = 2;
  // AES-256-GCM: a random 32-byte key for this file alone. The stored
  // bytes are a 12-byte nonce followed by the ciphertext and its tag.
  bytes key = 3;
  // SHA-256 of the stored bytes, checked before they're opened.
  bytes sha256 = 4;
  // The stored bytes' size.
  int64 size = 5;
  // What it is once opened, such as "audio/ogg; codecs=opus", as the sender
  // said. Apps decide what to show inline from the opened bytes, never this.
  string content_type = 6;
  // The file's name (no folders), at most 255 characters.
  string name = 7;
  // A picture's or video's size in pixels, so its place is kept while it
  // opens; 0 when unknown or not one.
  uint32 width = 8;
  uint32 height = 9;
  // 0: sealed in one piece (a 12-byte nonce, then the ciphertext and tag), as
  // voice messages are. Otherwise the padded file is sealed in chunks of this
  // many bytes (64 KiB to 8 MiB), each with its 16-byte tag, one after
  // another; chunk i uses the nonce of 4 zero bytes then i as 8 big-endian
  // bytes, with the top bit set on the last chunk.
  uint32 chunk_bytes = 10;
  // The file's own size before padding, to show before it's fetched.
  int64 file_size = 11;
}

// ───────────────────────── Message backup ─────────────────────────

message Backup {
  // HKDF-SHA256 of the recovery key (salt "fuwa backup v1", info "check"):
  // lets a device tell it has the right key without the instance learning it.
  bytes key_check = 1;
  // Bytes in its parts, and how many there are.
  int64 size = 2;
  int64 parts = 3;
  // The most it may hold, in bytes.
  int64 max_size = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // The place the next part takes: parts are numbered from 1, one after
  // another, and each is sealed for its place.
  int64 next_sequence = 7;
}

message GetBackupRequest {}

message GetBackupResponse {
  // Unset if the account has no backup.
  Backup backup = 1;
}

message StartBackupRequest {
  // 32 bytes.
  bytes key_check = 1;
  // Delete a backup the account already has and start over. An account can
  // start a backup at most 6 times an hour.
  bool replace = 2;
}

message StartBackupResponse {
  Backup backup = 1;
}

message AddBackupPartRequest {
  // The key check of the backup this part is for.
  bytes key_check = 1;
  // At most 256 KiB: a 12-byte nonce, then AES-256-GCM of a BackupPart.
  bytes data = 2;
  // Its place: the backup's next_sequence.
  int64 sequence = 3;
}

message AddBackupPartResponse {
  int64 sequence = 1;
  Backup backup = 2;
}

message ListBackupPartsRequest {
  int64 after_sequence = 1;
  // 1 to 100; defaults to 50. Fewer come back if they'd pass 3 MiB.
  int32 limit = 2;
}

message ListBackupPartsResponse {
  repeated BackupPartData parts = 1;
  bool has_more = 2;
}

message BackupPartData {
  int64 sequence = 1;
  bytes data = 2;
}

message DeleteBackupRequest {}

message DeleteBackupResponse {}

// What a backup part holds once a device opens it; never sent unencrypted.
// Encrypted with AES-256-GCM under HKDF-SHA256 of the recovery key (salt
// "fuwa backup v1", info "encrypt"), with "fuwa backup v1|<account id>|<its
// sequence>" as associated data, so the instance can't move a part to
// another place or account without it failing to open.
message BackupPart {
  repeated BackupItem items = 1;
  // Zeros, so parts come in a few sizes and say little about what's in them.
  bytes padding = 15;
}

// One line of a direct message or secure channel, as the device that read it
// kept it. A later copy of the same line (same conversation and sequence)
// replaces an earlier one if it was edited later or deleted.
message BackupItem {
  // The direct message's or secure channel's id.
  string conversation_id = 1;
  int64 sequence = 2;
  // Unix ms, as the instance stamped the record.
  int64 at_ms = 3;
  string sender_id = 4;
  string device_id = 5;
  BackupItemKind kind = 6;
  string content = 7;
  int64 reply_to_sequence = 8;
  int64 edited_at_ms = 9;
  bool deleted = 10;
  repeated BackupDevice added = 11;
  repeated BackupDevice removed = 12;
  // A secure channel message's signed form, for sharing history later.
  SignedForm signed = 13;
  SignedForm edit_signed = 14;
  // Who passed it on, if it came as shared history.
  string shared_by = 15;
  // A secure channel's thread reply: the message it's under, and whether it
  // was also sent to the channel. For a THREAD item, the thread it changes.
  int64 thread_sequence = 16;
  bool in_channel = 17;
  // For a THREAD item: whether it locked the thread or unlocked it.
  bool locked = 18;
  // A voice message's file, key and waveform (BACKUP_ITEM_KIND_VOICE). The
  // file itself stays on the instance, until the message is deleted.
  DirectMessageVoice voice = 19;
  // A text's files (DirectMessageText.files). The files themselves stay on
  // the instance, until the message is deleted.
  repeated SealedFile files = 20;
}

enum BackupItemKind {
  BACKUP_ITEM_KIND_UNSPECIFIED = 0;
  BACKUP_ITEM_KIND_TEXT = 1;
  BACKUP_ITEM_KIND_DEVICES = 2;
  BACKUP_ITEM_KIND_RESET = 3;
  BACKUP_ITEM_KIND_SETTING = 4;
  // A moderator locked or unlocked a thread in a secure channel.
  BACKUP_ITEM_KIND_THREAD = 5;
  BACKUP_ITEM_KIND_VOICE = 6;
}

message BackupDevice {
  string user_id = 1;
  string device_id = 2;
}

message SignedForm {
  bytes payload = 1;
  bytes signature = 2;
  bytes signature_key = 3;
}
