syntax = "proto3";

package fuwa.v1;

import "google/protobuf/timestamp.proto";

// Pictures people upload to this instance: profile pictures, profile banners,
// server icons, custom emoji and app backgrounds.
//
// An upload takes two steps. CreateUpload checks the file and reserves a
// place for it; then an HTTP PUT of the file's bytes to `upload_url` stores
// it (no other headers needed, and browsers can follow its progress). The
// picture is then served at `media.url` to anyone with the link. Setting that
// URL as an avatar, banner or server icon keeps it; replacing or clearing it
// deletes the old one. Uploads nothing uses are deleted after a day.
//
// Backgrounds are pictures people put behind the app (fuwa themes). The app
// settings that use them live on the device, so the instance keeps a small
// list of each account's backgrounds instead: KeepBackground adds an upload
// to it, and DeleteBackground removes one and its file.
service MediaService {
  rpc CreateUpload(CreateUploadRequest) returns (CreateUploadResponse);
  // Keeps an uploaded background, so it isn't swept. At most 24 per account.
  rpc KeepBackground(KeepBackgroundRequest) returns (KeepBackgroundResponse);
  // Your kept backgrounds, newest first.
  rpc ListBackgrounds(ListBackgroundsRequest) returns (ListBackgroundsResponse);
  rpc DeleteBackground(DeleteBackgroundRequest) returns (DeleteBackgroundResponse);
}

// What an upload is for. A picture can only be used for what it was uploaded
// for, and only by the account that uploaded it.
enum MediaPurpose {
  MEDIA_PURPOSE_UNSPECIFIED = 0;
  MEDIA_PURPOSE_AVATAR = 1;
  // A profile banner, or with a server_id, a server's banner.
  MEDIA_PURPOSE_BANNER = 2;
  MEDIA_PURPOSE_SERVER_ICON = 3;
  // A server's custom emoji.
  MEDIA_PURPOSE_EMOJI = 4;
  // A picture behind the app, kept with KeepBackground.
  MEDIA_PURPOSE_BACKGROUND = 5;
  // A GIF of your own to send (GifService.SaveGif keeps it). Only image/gif.
  MEDIA_PURPOSE_GIF = 8;
}

// A stored file.
message Media {
  string id = 1;
  // Where it's served. Stays the same for as long as the file exists.
  string url = 2;
  string content_type = 3;
  int64 size = 4;
}

message CreateUploadRequest {
  MediaPurpose purpose = 1;
  // image/png, image/jpeg, image/gif, image/webp or image/avif. The bytes are
  // checked when they arrive.
  string content_type = 2;
  // The file's exact size in bytes, at most the instance's
  // `picture_upload_bytes` when that's set.
  int64 size = 3;
  // For a server's icon or banner, an emoji or a webhook's picture (and
  // for a server's banner, needed): the server it's
  // for (you must be in it). The picture can then only be used there, and on
  // an instance split across regions its bytes go straight to the server's
  // region rather than the home one.
  string server_id = 4;
}

message CreateUploadResponse {
  // Where to PUT the file's bytes. Works once, until `expires_at`.
  string upload_url = 1;
  google.protobuf.Timestamp expires_at = 2;
  // Where the file will be once it's stored.
  Media media = 3;
}

message KeepBackgroundRequest {
  // The `media.url` of a stored background upload of yours.
  string url = 1;
}

message KeepBackgroundResponse {
  Media media = 1;
}

message ListBackgroundsRequest {}

message ListBackgroundsResponse {
  repeated Media backgrounds = 1;
}

message DeleteBackgroundRequest {
  string url = 1;
}

message DeleteBackgroundResponse {}
