syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/secure.proto";
import "google/protobuf/timestamp.proto";

// ============================================================================
// Instance
// ============================================================================

// A fuwa instance: one running fuwa server. It hosts any number of community
// servers, each in its own database, and keeps the accounts that use them.
message Node {
  string name = 1;
  string version = 2;
  // The URL clients reach this instance on.
  string public_url = 3;
  AuthMethods auth = 4;
  ServerCreation server_creation = 5;
  // Whether this instance sends the anonymous usage signal and its hourly
  // report of errors and slow paths. While it's off, apps send no reports.
  bool telemetry = 6;
  // A banner the instance's admins put up for everyone, while it runs.
  Announcement announcement = 7;
  // The build the instance says it runs.
  Build build = 8;
  // Who may make agents (bot accounts).
  AgentCreation agent_creation = 9;
  // Where this instance keeps community servers, the home region first.
  // Empty, or one region, when there's no choice to make (an instance run
  // as one process, or one whose parts are all in one place).
  repeated Region regions = 10;
}

// A part of the world a split instance keeps servers in (docs/regions.md).
// A server's messages, recordings and calls stay in its region.
message Region {
  // A short label, such as "eu" or "us-west". Empty for the home region of
  // an instance whose parts don't name theirs.
  string id = 1;
  // What people see, such as "Europe".
  string name = 2;
  // Where accounts, sessions and direct messages are kept, and new servers
  // go unless their creator picks another.
  bool home = 3;
}

// What a fuwa binary was built from. The instance reports this about itself,
// so it's a claim, not proof: clients show it as plain text, never as a sign
// the server is verified.
message Build {
  // Same as Node.version, such as "0.4.2".
  string version = 1;
  // The full git commit the binary was built from. Empty when the builder
  // didn't know it.
  string commit = 2;
  // Where the source lives, such as "https://github.com/waifu-devs/fuwa".
  string source = 3;
}

// A notice from an instance's admins, shown on every client, signed in or not.
message Announcement {
  // Changes with the text, so a banner someone closed comes back for a new one.
  string id = 1;
  // Inline Markdown, up to 300 characters.
  string text = 2;
  AnnouncementTone tone = 3;
  google.protobuf.Timestamp created_at = 4;
  // When it comes down by itself. Unset: it stays until an admin takes it down.
  google.protobuf.Timestamp ends_at = 5;
}

enum AnnouncementTone {
  // Same as INFO.
  ANNOUNCEMENT_TONE_UNSPECIFIED = 0;
  ANNOUNCEMENT_TONE_INFO = 1;
  // Something is about to change, such as planned maintenance.
  ANNOUNCEMENT_TONE_WARNING = 2;
  // Something is wrong now. Clients don't let people close it.
  ANNOUNCEMENT_TONE_CRITICAL = 3;
}

// Which kinds of account this instance accepts. The operator switches each on or off.
message AuthMethods {
  // Standalone accounts: a username and password kept on this instance only.
  bool local_sign_in = 1;
  // Whether new standalone accounts can be created.
  bool local_sign_up = 2;
  // Linked accounts: signed in through a waifu.dev account.
  bool linked_sign_in = 3;
  // The issuer linked accounts come from.
  string linked_issuer = 4;
  // Whether someone new can sign in with waifu.dev and get a linked account.
  bool linked_sign_up = 5;
  // Single sign-on through the instance's identity provider.
  bool sso_sign_in = 6;
  // Whether someone new can sign in through it and get an account.
  bool sso_sign_up = 7;
  // The provider's name, for "Continue with <name>".
  string sso_name = 8;
  // The host of the provider's sign-in page: that site sees the address of
  // whoever signs in, so apps name it next to the button.
  string sso_host = 9;
}

// Who may make agents (accounts programs drive) on an instance.
enum AgentCreation {
  AGENT_CREATION_UNSPECIFIED = 0;
  AGENT_CREATION_EVERYONE = 1;
  AGENT_CREATION_ADMINS = 2;
  AGENT_CREATION_DISABLED = 3;
}

// Who may create community servers on an instance.
enum ServerCreation {
  SERVER_CREATION_UNSPECIFIED = 0;
  SERVER_CREATION_EVERYONE = 1;
  SERVER_CREATION_ADMINS = 2;
  SERVER_CREATION_DISABLED = 3;
}

// ============================================================================
// People
// ============================================================================

enum AccountKind {
  ACCOUNT_KIND_UNSPECIFIED = 0;
  // Created on this instance, signs in with a password.
  ACCOUNT_KIND_LOCAL = 1;
  // Signs in through waifu.dev.
  ACCOUNT_KIND_LINKED = 2;
  // Driven by a program, made by a person; signs in with a token. See
  // AgentService.
  ACCOUNT_KIND_AGENT = 3;
  // Signs in through the instance's single sign-on (an identity provider
  // its admins set up). See AuthService.StartSsoSignIn.
  ACCOUNT_KIND_SSO = 4;
}

// A person's public profile.
message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_url = 4;
  AccountKind kind = 5;
  // A custom status the person set, such as "at the gym". Clients stop
  // showing it once status_expires_at has passed.
  string status = 6;
  google.protobuf.Timestamp status_expires_at = 7;
}

// Everything a person shows about themselves on an instance, beyond what
// travels with every message.
message Profile {
  User user = 1;
  string pronouns = 2;
  // Markdown.
  string bio = 3;
  string banner_url = 4;
  // The profile's color, as 0xRRGGBB. Unset lets clients pick one.
  optional int32 accent_color = 5;
  // When the account was made on this instance.
  google.protobuf.Timestamp created_at = 6;
}

message Member {
  string server_id = 1;
  User user = 2;
  string nickname = 3;
  reserved 4;
  reserved "role";
  google.protobuf.Timestamp joined_at = 5;
  // Timed out: can read but not send or edit messages until then. Unset, or
  // in the past, when they aren't.
  google.protobuf.Timestamp timed_out_until = 6;
  // The roles they have, besides @everyone, which every member has.
  repeated string role_ids = 7;
  // Joined, but hasn't agreed to the server's rules yet: they can read, but
  // not send messages, make invites or change their nickname until they do.
  bool pending = 8;
  // When they last signed in through the server's single sign-on; unset if
  // they never have. While the server requires it, a member (other than the
  // owner or an agent) without one, or whose sign-in is older than
  // sso_recheck_days, sees no channels until they sign in again.
  google.protobuf.Timestamp sso_signed_in_at = 9;
}

// ============================================================================
// Roles and permissions
// ============================================================================

// What a role lets its members do. The server's owner can do everything;
// everyone else can do what their roles allow, as each channel's
// permission overwrites change it.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;

  // Server-wide only.

  // Every permission in every channel, whatever the channel says. Still
  // only over roles and people ranked below.
  PERMISSION_ADMINISTRATOR = 1;
  // The server's name, icon, description, system messages and usage.
  PERMISSION_MANAGE_SERVER = 2;
  // Roles ranked below their own: create, edit, hand out. In a channel, its
  // permission overwrites.
  PERMISSION_MANAGE_ROLES = 3;
  PERMISSION_VIEW_AUDIT_LOG = 4;
  PERMISSION_CHANGE_NICKNAME = 5;
  // Other people's nicknames.
  PERMISSION_MANAGE_NICKNAMES = 6;
  PERMISSION_KICK_MEMBERS = 7;
  PERMISSION_BAN_MEMBERS = 8;
  PERMISSION_TIME_OUT_MEMBERS = 9;

  // Server-wide, and per channel through overwrites.

  // Create, edit, move and delete channels. Also skips slow mode.
  PERMISSION_MANAGE_CHANNELS = 10;
  // See a channel and read its messages.
  PERMISSION_VIEW_CHANNELS = 11;
  PERMISSION_SEND_MESSAGES = 12;
  PERMISSION_EMBED_LINKS = 13;
  PERMISSION_ATTACH_FILES = 14;
  // Ping everyone with @everyone or @here, and every role, mentionable or not.
  PERMISSION_MENTION_EVERYONE = 15;
  // Delete other people's messages. Also skips slow mode.
  PERMISSION_MANAGE_MESSAGES = 16;
  // Make invite links, into the server or into a channel.
  PERMISSION_CREATE_INVITE = 17;

  // Server-wide only.

  // Add, rename and delete the server's custom emoji.
  PERMISSION_MANAGE_EMOJI = 18;
  // Create, change and delete the server's webhooks, and see their addresses.
  PERMISSION_MANAGE_WEBHOOKS = 19;

  // Server-wide, and per channel through overwrites.

  // Join voice channels.
  PERMISSION_CONNECT = 20;
  // Be heard in voice channels. Without it, people join muted.
  PERMISSION_SPEAK = 21;
  // Mute and deafen others in voice channels.
  PERMISSION_MUTE_MEMBERS = 22;
  // Disconnect others from voice channels.
  PERMISSION_MOVE_MEMBERS = 23;
  // Turn their camera on and share their screen in voice channels.
  PERMISSION_VIDEO = 24;
  // Record voice channels on their own device. Everyone in the channel
  // sees while someone records.
  PERMISSION_RECORD = 25;
}

// A named set of permissions handed to members. Every server has @everyone,
// whose id is the server's id: every member has it, it sits at position 0,
// and only its permissions can change.
message Role {
  string id = 1;
  string server_id = 2;
  string name = 3;
  // 0xRRGGBB. Unset for none: names keep their usual color.
  optional int32 color = 4;
  // Rank: higher is above. A member ranks as their highest role, and acts
  // only on roles and people ranked below them.
  int32 position = 5;
  repeated Permission permissions = 6;
  // Its members are listed under it in the member list.
  bool hoist = 7;
  // Anyone can @mention it. People who can mention everyone can mention any role.
  bool mentionable = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

enum OverwriteTarget {
  OVERWRITE_TARGET_UNSPECIFIED = 0;
  // A role; @everyone's id is the server's.
  OVERWRITE_TARGET_ROLE = 1;
  OVERWRITE_TARGET_MEMBER = 2;
}

// How one channel changes a role's or member's permissions. A channel in a
// category takes the category's overwrites first, then its own. Within each,
// @everyone's apply first, then every role's the member has, then the
// member's own; a deny takes a permission away and an allow gives it back.
message PermissionOverwrite {
  // A role id, or a member's user id.
  string target_id = 1;
  OverwriteTarget target = 2;
  repeated Permission allow = 3;
  repeated Permission deny = 4;
}

// ============================================================================
// Community servers
// ============================================================================

// A community server. Each one lives in its own database file on its instance.
message Server {
  string id = 1;
  string name = 2;
  string description = 3;
  string icon_url = 4;
  string owner_id = 5;
  // Listed for anyone on the instance to find and join.
  bool discoverable = 6;
  int64 member_count = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // How members hear about messages until they choose for themselves: unset
  // leaves it to each person, MENTIONS only for @mentions.
  NotificationLevel default_notifications = 10;
  // Where "someone joined" messages go. Empty for nowhere.
  string system_channel_id = 11;
  // How old an account must be to join, in seconds. Zero lets anyone in.
  int32 min_account_age_seconds = 12;
  // People apply to join, answering the server's questions, and wait for
  // someone who can kick members to let them in.
  bool applications = 13;
  // Only accounts that sign in with waifu.dev (linked accounts) can join or apply.
  bool linked_only = 14;
  // It has rules: new members agree to them before they talk.
  bool has_rules = 15;
  // It has a welcome screen turned on: new members see it once they're in.
  bool has_welcome_screen = 16;
  // People sign in through the server's identity provider to join and to
  // keep seeing it. See SsoService.
  bool sso_required = 17;
  // The provider's name, for "Continue with <name>", while it's required.
  string sso_name = 18;
  // How many days a member's sign-in lasts; 0 for forever.
  int32 sso_recheck_days = 19;
  // The host of the provider's sign-in page, while it's required: that site
  // sees the address of whoever signs in, so apps name it before sending
  // anyone there.
  string sso_host = 20;
  // The region its data is kept in (Node.regions): its messages, files,
  // recordings and calls. Empty for the home region.
  string region = 21;
}

// What new members see once they're in: a few words and the channels to
// start with. Discord calls it the welcome screen.
message WelcomeScreen {
  bool enabled = 1;
  // Inline Markdown, up to 300 characters.
  string description = 2;
  // Up to 5, in order. Members only get the ones they can see.
  repeated WelcomeChannel channels = 3;
}

message WelcomeChannel {
  string channel_id = 1;
  // Why to go there, up to 60 characters.
  string description = 2;
  // A Unicode emoji, or one of the server's own written <:name:id>. Empty for none.
  string emoji = 3;
}

// A server's own emoji, written in messages as <:name:id>.
// An address other apps post messages to, into one channel. See
// WebhookService.
message Webhook {
  string id = 1;
  string server_id = 2;
  string channel_id = 3;
  // 1 to 80 characters: the name its messages show, unless a post says otherwise.
  string name = 4;
  // An upload on this instance, or empty.
  string avatar_url = 5;
  // Who made it.
  string creator_id = 6;
  google.protobuf.Timestamp created_at = 7;
  // The secret part of its address. Anyone who has it can post.
  string token = 8;
  // When it last posted; unset if it never has.
  google.protobuf.Timestamp last_used_at = 9;
  // How many messages it has posted.
  int64 messages = 10;
}

message Emoji {
  string id = 1;
  string server_id = 2;
  // 2 to 32 letters, digits and underscores, unique in the server.
  string name = 3;
  // An upload on this instance (MEDIA_PURPOSE_EMOJI).
  string url = 4;
  // A GIF that moves.
  bool animated = 5;
  // Who added it.
  string creator_id = 6;
  // The picture's size, counted in the server's attachment usage.
  int64 size = 7;
  google.protobuf.Timestamp created_at = 8;
}

// ============================================================================
// AutoMod
// ============================================================================

// What sets off an AutoMod rule.
enum AutoModTrigger {
  AUTO_MOD_TRIGGER_UNSPECIFIED = 0;
  // Words or phrases in a message.
  AUTO_MOD_TRIGGER_KEYWORDS = 1;
  // Too many people, roles, @everyone or @here pinged in one message.
  AUTO_MOD_TRIGGER_MENTION_SPAM = 2;
  // Links to sites the server doesn't allow.
  AUTO_MOD_TRIGGER_LINKS = 3;
  // A moderation provider the instance set up (such as TypeSafe Jev or
  // Cloudflare Clef) reads the message and says what kind it is.
  AUTO_MOD_TRIGGER_PROVIDER = 4;
}

// What a PROVIDER rule does about one kind of message, from least to most.
enum AutoModLevel {
  AUTO_MOD_LEVEL_UNSPECIFIED = 0;
  // Nothing.
  AUTO_MOD_LEVEL_OFF = 1;
  // An alert goes to the rule's alert channel; the message is sent.
  AUTO_MOD_LEVEL_FLAG = 2;
  // The message isn't sent (and an alert goes out, when the rule has a channel).
  AUTO_MOD_LEVEL_BLOCK = 3;
  // Blocked, and its author is timed out for the rule's TIME_OUT duration.
  AUTO_MOD_LEVEL_TIME_OUT = 4;
}

// One kind of message a PROVIDER rule looks for.
message AutoModLabelRule {
  // A label the provider offers, such as "hate" or "scam".
  string label = 1;
  AutoModLevel level = 2;
  // How sure the provider must be, 50 to 99 percent.
  int32 threshold = 3;
}

enum AutoModActionKind {
  AUTO_MOD_ACTION_KIND_UNSPECIFIED = 0;
  // The message isn't sent; its author is told why.
  AUTO_MOD_ACTION_KIND_BLOCK = 1;
  // An alert goes to a channel for moderators, with what was written.
  AUTO_MOD_ACTION_KIND_ALERT = 2;
  // The author is timed out.
  AUTO_MOD_ACTION_KIND_TIME_OUT = 3;
}

message AutoModAction {
  AutoModActionKind kind = 1;
  // BLOCK: what the author is told, up to 150 characters. Empty for the usual words.
  string message = 2;
  // ALERT: where alerts go, a text channel.
  string channel_id = 3;
  // TIME_OUT: for how long, 60 seconds to 28 days.
  int32 duration_seconds = 4;
}

// One of a server's AutoMod rules. It checks every message sent or edited
// by members who don't manage the server, outside the channels and roles it
// leaves out, and does each of its actions when the message sets it off.
message AutoModRule {
  string id = 1;
  string server_id = 2;
  string name = 3;
  bool enabled = 4;
  AutoModTrigger trigger = 5;
  // KEYWORDS: up to 1000 words or phrases, matched whole and ignoring case.
  // A * at the start or end matches any letters there: "*cat" matches
  // "bobcat", "cat*" matches "catapult" and "*cat*" matches anywhere.
  repeated string keywords = 6;
  // KEYWORDS: words that never set it off, even when a keyword matches them.
  // LINKS: sites (and their subdomains) people can link to.
  repeated string allowed = 7;
  // MENTION_SPAM: the most pings one message may carry, 1 to 50.
  int32 mention_limit = 8;
  // At least one.
  repeated AutoModAction actions = 9;
  // Members with any of these roles, and messages in these channels (or
  // channels in these categories), are left alone.
  repeated string exempt_role_ids = 10;
  repeated string exempt_channel_ids = 11;
  // Who made it.
  string creator_id = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // PROVIDER: which of the instance's moderation providers reads messages
  // (an AutoModProvider id). One PROVIDER rule per server.
  string provider = 15;
  // PROVIDER: what happens for each kind of message. Its ALERT action says
  // where flags go and its TIME_OUT action for how long; both are optional
  // until a label needs them.
  repeated AutoModLabelRule labels = 16;
  // PROVIDER: also show the provider the message's pictures (attached ones
  // and embeds'), when it reads pictures (AutoModProvider.pictures). Up to 4
  // PNG, JPEG or WebP pictures per message, fetched by the server.
  bool pictures = 17;
}

// What an AutoMod alert tells moderators.
message AutoModAlert {
  string rule_id = 1;
  string rule_name = 2;
  AutoModTrigger trigger = 3;
  // Where the message was sent.
  string channel_id = 4;
  // What it said.
  string content = 5;
  // What set the rule off: the words or links, or how many pings.
  repeated string matched = 6;
  // It wasn't sent.
  bool blocked = 7;
  // Its author was timed out for this long. Zero when they weren't.
  int32 timed_out_seconds = 8;
  // PROVIDER: the provider's name, such as "TypeSafe Jev".
  string provider = 9;
}

// What people read and answer on their way into a server.
message JoinForm {
  // Up to 16, each a line of Markdown. People agree to them before they talk.
  repeated string rules = 1;
  // Up to 5, asked when the server takes applications.
  repeated JoinQuestion questions = 2;
}

message JoinQuestion {
  string prompt = 1;
  // A few paragraphs rather than a line.
  bool paragraph = 2;
  bool required = 3;
}

enum ApplicationStatus {
  APPLICATION_STATUS_UNSPECIFIED = 0;
  // Waiting for someone to review it.
  APPLICATION_STATUS_PENDING = 1;
  // Turned down. They can apply again.
  APPLICATION_STATUS_REJECTED = 2;
  // Let in: they're a member now. Only in events; it isn't kept.
  APPLICATION_STATUS_APPROVED = 3;
  // Taken back by the applicant, or gone with a ban. Only in events.
  APPLICATION_STATUS_WITHDRAWN = 4;
}

// Someone asking to join a server that takes applications.
message Application {
  string server_id = 1;
  User user = 2;
  // The questions as they were asked, with what they said.
  repeated ApplicationAnswer answers = 3;
  ApplicationStatus status = 4;
  // Why it was turned down, when the reviewer said.
  string reason = 5;
  // When their account was made, to judge throwaway accounts by.
  google.protobuf.Timestamp account_created_at = 6;
  google.protobuf.Timestamp created_at = 7;
  // Whoever reviewed it, and when.
  string reviewed_by_id = 8;
  google.protobuf.Timestamp reviewed_at = 9;
}

message ApplicationAnswer {
  string question = 1;
  string answer = 2;
}

// A link into a server. Anyone with its code can join, even when the server
// isn't discoverable, until it expires or runs out of uses.
message Invite {
  // What goes at the end of the link, as in https://<instance>/invite/<code>.
  string code = 1;
  string server_id = 2;
  // The channel it opens, or empty for the server's first.
  string channel_id = 3;
  // Who made it.
  string inviter_id = 4;
  // How many people it lets in before it stops working. Zero for no limit.
  int32 max_uses = 5;
  int32 uses = 6;
  // Unset for never.
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_TEXT = 1;
  CHANNEL_TYPE_VOICE = 2;
  CHANNEL_TYPE_ANNOUNCEMENT = 3;
  CHANNEL_TYPE_THREAD = 4;
  CHANNEL_TYPE_CATEGORY = 5;
  // A text channel whose messages are end-to-end encrypted: only the devices
  // of people who can see it can read them (SecureChannelService). Its
  // messages never go through MessageService. A channel can't become secure,
  // or stop being secure, once made.
  CHANNEL_TYPE_SECURE = 6;
}

message Channel {
  string id = 1;
  string server_id = 2;
  string name = 3;
  ChannelType type = 4;
  // The category or channel this one sits under, if any.
  string parent_id = 5;
  string topic = 6;
  int32 position = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Slow mode: how long each member waits between messages here. People who
  // can manage messages or channels here don't wait. Zero for off.
  int32 slowmode_seconds = 10;
  repeated PermissionOverwrite permission_overwrites = 11;
}

enum MessageKind {
  // Written by someone.
  MESSAGE_KIND_UNSPECIFIED = 0;
  // The author joined the server. Posted in its system channel, with no text.
  MESSAGE_KIND_MEMBER_JOINED = 1;
  // AutoMod caught a message by the author. Posted in the rule's alert
  // channel, with no text; what happened is in `auto_mod`.
  MESSAGE_KIND_AUTO_MOD_ALERT = 2;
}

message Message {
  string id = 1;
  string server_id = 2;
  string channel_id = 3;
  string author_id = 4;
  string content = 5;
  repeated Attachment attachments = 6;
  repeated Embed embeds = 7;
  string reply_to_id = 8;
  google.protobuf.Timestamp created_at = 9;
  // Unset until the message is edited.
  google.protobuf.Timestamp edited_at = 10;
  MessageKind kind = 11;
  // It pings everyone: it says @everyone or @here and its author could
  // mention everyone in its channel.
  bool mentions_everyone = 12;
  // The roles it pings: written as <@&role id>, and mentionable or written
  // by someone who can mention everyone.
  repeated string mention_role_ids = 13;
  // For MESSAGE_KIND_AUTO_MOD_ALERT.
  AutoModAlert auto_mod = 14;
  // Posted by a webhook, whose id is the author_id: who it says it is.
  // Clients show this instead of a profile.
  MessageWebhook webhook = 15;
}

// The name and picture a webhook message was posted under: the webhook's
// own, or ones the post asked for.
message MessageWebhook {
  string webhook_id = 1;
  string name = 2;
  string avatar_url = 3;
}

message Attachment {
  string id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size = 4;
  string url = 5;
}

message Embed {
  string title = 1;
  string description = 2;
  string url = 3;
  int32 color = 4;
  repeated EmbedField fields = 5;
  string thumbnail_url = 6;
  string image_url = 7;
}

message EmbedField {
  string name = 1;
  string value = 2;
  bool inline = 3;
}

// ============================================================================
// Notifications
// ============================================================================

enum NotificationLevel {
  // Follow what's above: a channel follows its server, a server follows the
  // person's device settings.
  NOTIFICATION_LEVEL_UNSPECIFIED = 0;
  NOTIFICATION_LEVEL_ALL = 1;
  NOTIFICATION_LEVEL_MENTIONS = 2;
  NOTIFICATION_LEVEL_NOTHING = 3;
}

// How one server, or one channel in it, reaches a person. Kept on the
// instance, so it follows them to every device.
message NotificationSettings {
  string server_id = 1;
  // Empty for the server as a whole.
  string channel_id = 2;
  NotificationLevel level = 3;
  // Muted: no sounds, notifications or unread counts. With muted_until set,
  // only until then.
  bool muted = 4;
  google.protobuf.Timestamp muted_until = 5;
  // Server only: @everyone doesn't count as a mention.
  bool suppress_everyone = 6;
}

// ============================================================================
// Usage and limits
// ============================================================================

// What a community server uses. Counts are current totals unless named as
// lifetime counters, which only ever grow.
message ServerUsage {
  string server_id = 1;
  int64 members = 2;
  int64 channels = 3;
  int64 messages = 4;
  // Lifetime count of messages sent, including deleted ones.
  int64 messages_sent = 5;
  // Bytes of message text currently stored.
  int64 message_bytes = 6;
  int64 attachments = 7;
  int64 attachment_bytes = 8;
  // Lifetime count of events in the server's log.
  int64 events = 9;
  // Size of the server's database on disk, write-ahead log included.
  int64 storage_bytes = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Custom emoji. Their pictures count in attachments and attachment_bytes.
  int64 emojis = 12;
}

// Caps on a community server. An unset field means unlimited.
message ServerLimits {
  optional int64 members = 1;
  optional int64 channels = 2;
  optional int64 storage_bytes = 3;
  optional int64 attachment_bytes = 4;
  optional int64 emojis = 5;
  // Voice channel recordings kept on the server, all together, in bytes.
  // Once reached, recordings stop and no new one starts until some are
  // deleted.
  optional int64 recording_bytes = 6;
}

// ============================================================================
// Events
// ============================================================================

// Everything that changes in a community server is recorded as an event in its
// log, in order. Clients follow the log to stay in sync.
message Event {
  string id = 1;
  string server_id = 2;
  // Position in the server's log. Strictly increasing within a server.
  // Zero for events that aren't stored, like the server being deleted, or a
  // channel appearing (ChannelCreated) or going (ChannelDeleted) for one
  // member as their permissions change.
  int64 sequence = 3;
  string actor_id = 4;
  google.protobuf.Timestamp created_at = 5;

  oneof payload {
    ServerUpdated server_updated = 10;
    ServerDeleted server_deleted = 11;
    ChannelCreated channel_created = 12;
    ChannelUpdated channel_updated = 13;
    ChannelDeleted channel_deleted = 14;
    MessageCreated message_created = 15;
    MessageUpdated message_updated = 16;
    MessageDeleted message_deleted = 17;
    MemberJoined member_joined = 18;
    MemberUpdated member_updated = 19;
    MemberLeft member_left = 20;
    UserUpdated user_updated = 21;
    RoleCreated role_created = 22;
    RoleUpdated role_updated = 23;
    RoleDeleted role_deleted = 24;
    ApplicationUpdated application_updated = 25;
    EmojisUpdated emojis_updated = 26;
    SecureRecordAdded secure_record_added = 27;
    SecureRecordDeleted secure_record_deleted = 28;
    // Not stored: who's in a voice channel lives in memory, so these always
    // have sequence 0. After a reconnect, apps list them again
    // (CallService.ListVoiceStates).
    VoiceStateUpdated voice_state_updated = 40;
    VoiceStateRemoved voice_state_removed = 41;
  }
}

// Someone joined a voice channel, moved to another, or muted or deafened.
message VoiceStateUpdated {
  VoiceState state = 1;
}

// Someone left the voice channel they were in.
message VoiceStateRemoved {
  string user_id = 1;
  string channel_id = 2;
}

// Someone in a call: in a server's voice channel, or in a direct-message
// conversation's call.
message VoiceState {
  string user_id = 1;
  // The voice channel; empty for a direct-message call.
  string channel_id = 2;
  // The conversation; empty for a voice channel.
  string conversation_id = 3;
  // Muted or deafened by themselves.
  bool self_mute = 4;
  bool self_deaf = 5;
  // Muted or deafened by a moderator: they can't take it off themselves.
  bool server_mute = 6;
  bool server_deaf = 7;
  // When they joined the channel or call they're in.
  google.protobuf.Timestamp joined_at = 8;
  // They can't be heard here: they don't have SPEAK in this channel.
  bool suppress = 9;
  // Their camera is on.
  bool self_video = 10;
  // They can't turn their camera on or share their screen here: they don't
  // have VIDEO in this channel. Never set in direct-message calls.
  bool video_suppress = 11;
  // They're sharing their screen.
  bool self_stream = 12;
  // They're recording the call on their device. A courtesy their app shows,
  // not a lock: anyone can record what their own speakers play.
  bool self_record = 13;
  // They can't record here: they don't have RECORD in this channel. Never
  // set in direct-message calls.
  bool record_suppress = 14;
  // They're recording the voice channel on the server: the instance keeps
  // everyone's sound, one track per person, for the people with RECORD
  // there (CallService.ListRecordings). Needs RECORD, and the instance
  // allowing it (InstanceSettings.call_recordings). Never set in
  // direct-message calls.
  bool server_record = 15;
}

message ServerUpdated {
  Server server = 1;
}

message ServerDeleted {}

message ChannelCreated {
  Channel channel = 1;
}

message ChannelUpdated {
  Channel channel = 1;
}

message ChannelDeleted {
  string channel_id = 1;
}

message MessageCreated {
  Message message = 1;
}

message MessageUpdated {
  Message message = 1;
}

message MessageDeleted {
  string channel_id = 1;
  string message_id = 2;
}

message MemberJoined {
  Member member = 1;
}

message MemberUpdated {
  Member member = 1;
}

enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  // They left, or deleted their account.
  LEAVE_REASON_LEFT = 1;
  // An owner or admin removed them; they can join again.
  LEAVE_REASON_KICKED = 2;
  // An owner or admin removed them and keeps them out.
  LEAVE_REASON_BANNED = 3;
}

message MemberLeft {
  string user_id = 1;
  LeaveReason reason = 2;
}

// Someone who was a member changed how they look, such as when their account
// is deleted. Current members change through MemberUpdated instead.
message UserUpdated {
  User user = 1;
}

message RoleCreated {
  Role role = 1;
}

// Someone applied, or an application was reviewed or withdrawn. Only members
// who can kick members get these. Closed applications carry no answers.
message ApplicationUpdated {
  Application application = 1;
}

// The server's emoji changed: one was added, renamed or deleted. Carries
// every emoji the server has now.
message EmojisUpdated {
  repeated Emoji emojis = 1;
}

message RoleUpdated {
  Role role = 1;
}

// Members who had it and channel overwrites that named it lose it too,
// without events of their own.
message RoleDeleted {
  string role_id = 1;
}
