syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/types.proto";

// Roles in a community server. Every member can see them; MANAGE_ROLES
// changes the ones ranked below the caller's highest role, and grants only
// permissions the caller has. The owner ranks above every role.
service RoleService {
  // Every role, highest first; @everyone is last.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // Adds a role at the bottom, right above @everyone.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  // Takes it from everyone who has it and from every channel overwrite.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  // Puts every role but @everyone in a new order at once.
  rpc ReorderRoles(ReorderRolesRequest) returns (ReorderRolesResponse);
  rpc AddMemberRole(AddMemberRoleRequest) returns (AddMemberRoleResponse);
  rpc RemoveMemberRole(RemoveMemberRoleRequest) returns (RemoveMemberRoleResponse);
}

message ListRolesRequest {
  string server_id = 1;
}

message ListRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleRequest {
  string server_id = 1;
  string name = 2;
  optional int32 color = 3;
  repeated Permission permissions = 4;
  bool hoist = 5;
  bool mentionable = 6;
}

message CreateRoleResponse {
  Role role = 1;
}

// Permissions to set as a whole, so an update can tell "none" from "unchanged".
message PermissionSet {
  repeated Permission permissions = 1;
}

message UpdateRoleRequest {
  string server_id = 1;
  string role_id = 2;
  // @everyone keeps its name, color, hoist and mentionable.
  optional string name = 3;
  // Clears the color.
  bool clear_color = 4;
  optional int32 color = 5;
  // Replaces every permission. Two people editing a role at once lose each
  // other's changes this way, so new apps send grant and revoke instead.
  PermissionSet permissions = 6;
  optional bool hoist = 7;
  optional bool mentionable = 8;
  // Turns these on and leaves the rest as they are. Not with permissions.
  repeated Permission grant = 9;
  // Turns these off and leaves the rest as they are. Not with permissions.
  repeated Permission revoke = 10;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string server_id = 1;
  string role_id = 2;
}

message DeleteRoleResponse {}

message ReorderRolesRequest {
  string server_id = 1;
  // Every role but @everyone, highest first. Roles ranked at or above the
  // caller's highest role must stay where they are.
  repeated string role_ids = 2;
}

message ReorderRolesResponse {
  // Every role, highest first.
  repeated Role roles = 1;
}

message AddMemberRoleRequest {
  string server_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message AddMemberRoleResponse {
  Member member = 1;
}

message RemoveMemberRoleRequest {
  string server_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message RemoveMemberRoleResponse {
  Member member = 1;
}
