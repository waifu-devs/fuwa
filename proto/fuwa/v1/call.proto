syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Voice: talking in a server's voice channels, and calls in direct messages.
//
// Sound and cameras go over WebRTC to the instance's media part (an SFU: it
// passes each person's sound and camera on to everyone else in the call,
// and never mixes or keeps them). Calls here only arrange that: the app sends a WebRTC offer and gets
// the media part's answer back. After that, the media part and the app talk
// over the connection itself: a data channel named "fuwa" carries the offers
// and answers for people coming and going, as JSON ({"type": "offer" or
// "answer", "sdp": ...}), and a few notices ({"type": "replaced"} when the
// same account joined from somewhere else, {"type": "restarting"} when the
// media part is about to restart and the app should join again at once,
// {"type": "closed"} when the instance hung it up). The app says which
// size of each person's camera it wants with {"type": "layers", "layers":
// {"<mid>": "h" | "m" | "l" | "off"}}, naming the tracks the media part
// sent it: apps send their camera in three sizes (simulcast, rids "h", "m"
// and "l", full, half and a quarter), and each viewer gets the one that fits
// where it shows it, or none while it isn't showing it. An app's second
// video track is its shared screen, the same way: the others get it on a
// stream named "<account id>-screen".
//
// Who's in a call is kept in memory, not stored, and each app keeps its
// place with KeepVoice every 5 seconds; a place nobody kept for 15 seconds
// is let go. A part restarting forgets nothing anyone notices: the apps
// keep their place again with their next KeepVoice, and join the media part
// again when their connection drops, with the session they had. See
// docs/calls.md.
service CallService {
  // What an app needs before it makes an offer: whether this instance has
  // calls on, and the STUN and TURN servers to reach the media part through
  // (TURN credentials are made for the caller and expire). Signed in.
  rpc GetCallSettings(GetCallSettingsRequest) returns (GetCallSettingsResponse);

  // Joins a voice channel (CONNECT there), or moves to another one in the
  // same server. One place per account per server: joining from another
  // device takes the place over, and the first device hears "replaced". With
  // `session_id` it rejoins the session the caller already has, after its
  // connection dropped; that fails with FAILED_PRECONDITION when the place
  // was taken over meanwhile.
  rpc JoinVoice(JoinVoiceRequest) returns (JoinVoiceResponse);
  // Leaves the server's voice channel the caller is in, if any.
  rpc LeaveVoice(LeaveVoiceRequest) returns (LeaveVoiceResponse);
  // Keeps the caller's place, and changes their own mute and deafen. Fails
  // with FAILED_PRECONDITION when `session_id` isn't the caller's place any
  // more (it was taken over, a moderator disconnected them, or they lost
  // CONNECT); the app hangs up then.
  rpc KeepVoice(KeepVoiceRequest) returns (KeepVoiceResponse);
  // Who's in the server's voice channels now, leaving out the channels the
  // caller can't see.
  rpc ListVoiceStates(ListVoiceStatesRequest) returns (ListVoiceStatesResponse);
  // Server mutes or deafens someone in a voice channel (MUTE_MEMBERS), or
  // disconnects them (MOVE_MEMBERS). Only people ranked below the caller.
  rpc ModerateVoice(ModerateVoiceRequest) returns (ModerateVoiceResponse);

  // For agents, bots and other programs: joins a voice channel without
  // WebRTC, for as long as this stream is open, the same as JoinVoice
  // otherwise (CONNECT there, one place per account per server, and
  // everyone sees you in it). The first message says you're in; then each
  // person's sound comes as frames of Opus (48 kHz, 20 ms each), labelled
  // with whose they are. Nothing needs keeping: the stream keeps the place,
  // and closing it leaves. It ends with FAILED_PRECONDITION when you were
  // taken out of the call, or joined it from somewhere else; any other end
  // (the instance restarting) is worth opening again with the same
  // `session_id`. The media part restarting doesn't end it. When nobody has
  // said anything for a while a keepalive comes every 15 seconds, so a
  // stream that stays quiet for much longer than that is gone. Voice
  // channels only: calls in direct messages are end-to-end encrypted.
  rpc ListenVoice(ListenVoiceRequest) returns (stream ListenVoiceResponse);
  // Says something in the voice channel ListenVoice put you in: frames of
  // Opus, 48 kHz, 20 ms each (mono or stereo), which go out to everyone one
  // every 20 ms, in order. At most a second's worth (50 frames) may be
  // waiting; send them about as fast as they play. `interrupt` drops what's
  // still waiting first, to stop talking when someone talks over you. Needs
  // SPEAK and not being server muted (PERMISSION_DENIED otherwise).
  rpc SpeakVoice(SpeakVoiceRequest) returns (SpeakVoiceResponse);

  // A voice channel's recordings on the server, newest first, the one going
  // on now included. Needs RECORD there.
  rpc ListRecordings(ListRecordingsRequest) returns (ListRecordingsResponse);
  // One person's track of a finished recording, as a file sent in pieces:
  // their sound as Ogg Opus, or (in recordings with video) their camera or
  // shared screen as WebM. Needs RECORD in the recording's channel.
  rpc DownloadRecording(DownloadRecordingRequest) returns (stream DownloadRecordingResponse);
  // Deletes a finished recording. Needs RECORD in its channel, and to have
  // started it or MANAGE_CHANNELS there.
  rpc DeleteRecording(DeleteRecordingRequest) returns (DeleteRecordingResponse);

  // Joins the call in a direct-message conversation, starting it if nobody
  // is in it. The other person's apps hear it ring (CallUpdated on
  // DirectMessageService.Watch). The sound is end-to-end encrypted by the
  // apps on top of WebRTC's own encryption, with a key from the
  // conversation's MLS group, so the media part passes on what it can't hear.
  rpc JoinDmCall(JoinDmCallRequest) returns (JoinDmCallResponse);
  rpc LeaveDmCall(LeaveDmCallRequest) returns (LeaveDmCallResponse);
  rpc KeepDmCall(KeepDmCallRequest) returns (KeepDmCallResponse);
  // The calls going on in the caller's conversations.
  rpc ListDmCalls(ListDmCallsRequest) returns (ListDmCallsResponse);
}

message IceServer {
  repeated string urls = 1;
  string username = 2;
  string credential = 3;
}

message GetCallSettingsRequest {}

message GetCallSettingsResponse {
  // Off: the instance's admins turned calls off, or it couldn't start its
  // media part. Voice channels show, but nobody can join them.
  bool enabled = 1;
  repeated IceServer ice_servers = 2;
  // Voice channels can be recorded on the server
  // (InstanceSettings.call_recordings), by people with RECORD there.
  bool recordings = 3;
  // A shared screen may bring its sound: apps send it as a second audio
  // track after the microphone, and the media part passes it on (named like
  // the screen) while the screen is shared. Off from instances that predate
  // it, whose media part takes one audio track only.
  bool screen_sound = 4;
  // Servers may have their recordings keep video too
  // (InstanceSettings.call_recording_video, Server.record_video).
  bool recording_video = 5;
  // The ceiling on cameras in this instance's calls
  // (InstanceSettings.camera_max_height and camera_max_fps): the tallest
  // picture in pixels and the most frames a second. 0 for none. Apps send
  // the lowest of this, the server's (Server.camera_max_height) and the
  // person's own choice.
  uint32 camera_max_height = 6;
  uint32 camera_max_fps = 7;
}

message JoinVoiceRequest {
  string server_id = 1;
  string channel_id = 2;
  // The app's WebRTC offer, SDP. It sends its microphone (one audio track,
  // send only), at most one camera (one video track, send only, VP8, in
  // up to three simulcast sizes) and opens the "fuwa" data channel. The
  // camera's track can be there with nothing on it yet: others get it once
  // its first frame arrives.
  string offer = 3;
  bool self_mute = 4;
  bool self_deaf = 5;
  // Rejoin this session instead of starting a new one.
  string session_id = 6;
  // The camera is on (VIDEO there).
  bool self_video = 7;
  // Sharing their screen (VIDEO there).
  bool self_stream = 8;
  // Recording the call (RECORD there).
  bool self_record = 9;
  // Recording the call on the server (RECORD there; see
  // VoiceState.server_record).
  bool server_record = 10;
}

message JoinVoiceResponse {
  // The media part's WebRTC answer, SDP.
  string answer = 1;
  // The caller's place: KeepVoice and rejoining name it.
  string session_id = 2;
  VoiceState state = 3;
  // Asked to record on the server, but the server's recordings are as big
  // as its cap allows (ServerLimits.recording_bytes): delete some first.
  bool recordings_full = 4;
}

message LeaveVoiceRequest {
  string server_id = 1;
  // Leave only if this is still the caller's session; empty for whichever.
  string session_id = 2;
}

message LeaveVoiceResponse {}

message KeepVoiceRequest {
  string server_id = 1;
  string session_id = 2;
  // Where the caller is: the place comes back here after the server's part
  // restarted and forgot it.
  string channel_id = 3;
  bool self_mute = 4;
  bool self_deaf = 5;
  bool self_video = 6;
  bool self_stream = 7;
  bool self_record = 8;
  bool server_record = 9;
}

message KeepVoiceResponse {
  VoiceState state = 1;
  // As in JoinVoiceResponse: recording on the server stopped, or didn't
  // start, because the server's recordings are full.
  bool recordings_full = 2;
  // Recording on the server stopped because someone changed what the
  // server's recordings keep (Server.record_video). It doesn't start again
  // by itself: press Record to start a new one, as it now says.
  bool recording_ended = 3;
}

message ListVoiceStatesRequest {
  string server_id = 1;
}

message ListVoiceStatesResponse {
  repeated VoiceState states = 1;
}

message ModerateVoiceRequest {
  string server_id = 1;
  string user_id = 2;
  // Unset leaves it as it is.
  optional bool server_mute = 3;
  optional bool server_deaf = 4;
  // Takes them out of the voice channel.
  bool disconnect = 5;
  // Turns their camera and shared screen off, and keeps them off here until
  // a moderator lifts it (VoiceState.server_video_off). Needs MUTE_MEMBERS.
  optional bool server_video_off = 6;
}

message ModerateVoiceResponse {}

message ListenVoiceRequest {
  string server_id = 1;
  string channel_id = 2;
  bool self_mute = 3;
  bool self_deaf = 4;
  // Rejoin this session, after the stream was cut off.
  string session_id = 5;
}

message ListenVoiceResponse {
  oneof event {
    // First: you're in, as this session (SpeakVoice names it).
    VoiceJoined joined = 1;
    // Someone's sound.
    VoiceFrame frame = 2;
    // Nothing to pass on: sent every 15 seconds while no sound came, so
    // the program can tell a quiet call from a stream that's gone.
    VoiceKeepalive keepalive = 3;
  }
}

message VoiceKeepalive {}

message VoiceJoined {
  string session_id = 1;
  VoiceState state = 2;
}

// One frame of someone's sound, as they sent it.
message VoiceFrame {
  // Whose it is.
  string user_id = 1;
  // One Opus packet: decode it with any Opus decoder at 48 kHz.
  bytes opus = 2;
  // When it was spoken, in 48 kHz ticks of that person's own clock (960 a
  // frame): a gap of more than 960 since their last frame is sound that was
  // lost or silence they didn't send.
  uint32 timestamp = 3;
}

message SpeakVoiceRequest {
  string server_id = 1;
  string session_id = 2;
  // Each one Opus packet, 20 ms of sound.
  repeated bytes frames = 3;
  // Drops the frames still waiting to go out before queueing these; with
  // no frames, just stops talking.
  bool interrupt = 4;
}

message SpeakVoiceResponse {
  // Frames waiting to go out now, including these.
  uint32 queued = 1;
}

message JoinDmCallRequest {
  string conversation_id = 1;
  string offer = 2;
  bool self_mute = 3;
  bool self_deaf = 4;
  string session_id = 5;
  bool self_video = 6;
  bool self_stream = 7;
  bool self_record = 8;
}

message JoinDmCallResponse {
  string answer = 1;
  string session_id = 2;
  VoiceState state = 3;
}

message LeaveDmCallRequest {
  string conversation_id = 1;
  string session_id = 2;
}

message LeaveDmCallResponse {}

message KeepDmCallRequest {
  string conversation_id = 1;
  string session_id = 2;
  bool self_mute = 3;
  bool self_deaf = 4;
  bool self_video = 5;
  bool self_stream = 6;
  bool self_record = 7;
}

message KeepDmCallResponse {
  VoiceState state = 1;
}

message ListDmCallsRequest {}

message ListDmCallsResponse {
  repeated DmCall calls = 1;
}

// The call going on in a direct-message conversation.
message DmCall {
  string conversation_id = 1;
  // Everyone in it; none when it ended.
  repeated VoiceState participants = 2;
  // When it started: apps ring for a call that started a moment ago and
  // that you're not in.
  google.protobuf.Timestamp started_at = 3;
  // Who started it.
  string started_by = 4;
}

// A voice channel recorded on the server: one track per person who spoke.
message Recording {
  string id = 1;
  string channel_id = 2;
  // Who turned it on.
  string started_by = 3;
  google.protobuf.Timestamp started_at = 4;
  // Unset while it's going on.
  google.protobuf.Timestamp ended_at = 5;
  repeated RecordingTrack tracks = 6;
  // All its tracks' files together.
  int64 size_bytes = 7;
  // It keeps cameras and shared screens too (Server.record_video was on
  // when it started).
  bool video = 8;
}

// One person's sound in a recording, from when the recording started (it's
// silent until they first spoke) to when it ended, and in recordings with
// video their camera and shared screen, each from the first picture to the
// last (on the same clock: a picture at 1:00 goes with the sound at 1:00).
message RecordingTrack {
  string user_id = 1;
  // The sound's file.
  int64 size_bytes = 2;
  int64 duration_ms = 3;
  // Their camera's file; zero when it was never on.
  int64 camera_bytes = 4;
  // Their shared screen's file; zero when they never shared it.
  int64 screen_bytes = 5;
}

// Which of a person's files in a recording.
enum RecordingPart {
  // Their sound, as Ogg Opus.
  RECORDING_PART_UNSPECIFIED = 0;
  // Their camera, as WebM (VP8, no sound).
  RECORDING_PART_CAMERA = 1;
  // Their shared screen, as WebM (VP8, no sound).
  RECORDING_PART_SCREEN = 2;
}

message ListRecordingsRequest {
  string server_id = 1;
  string channel_id = 2;
}

message ListRecordingsResponse {
  repeated Recording recordings = 1;
  // What all of the server's recordings come to, in bytes, the one going on
  // included, and the most they may (unset: no cap).
  int64 used_bytes = 2;
  optional int64 cap_bytes = 3;
  // Days a finished recording is kept (unset: until someone deletes it).
  optional int64 keep_days = 4;
}

message DownloadRecordingRequest {
  string server_id = 1;
  string recording_id = 2;
  // Whose track.
  string user_id = 3;
  // Unset for their sound.
  RecordingPart part = 4;
}

message DownloadRecordingResponse {
  // The next piece of the file.
  bytes data = 1;
}

message DeleteRecordingRequest {
  string server_id = 1;
  string recording_id = 2;
}

message DeleteRecordingResponse {}
