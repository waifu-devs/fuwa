syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/types.proto";

// Messages in a channel.
service MessageService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  // A page of a channel's messages, oldest first.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // Authors edit their own messages.
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse);
  // Authors delete their own messages; owners and admins delete any. In a
  // channel shared from another server, MANAGE_MESSAGES deletes only this
  // server's members' messages; the home server's moderators delete any.
  // Deleting a message with a thread under it deletes the thread too: its
  // author may when every reply is theirs, moderators always.
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  // A channel's threads, the latest reply first: the messages they're under,
  // with their summaries. Not in channels shared between servers.
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  // People who can manage messages lock and unlock threads.
  rpc UpdateThread(UpdateThreadRequest) returns (UpdateThreadResponse);
  // Following a thread: its replies notify you. Starting a thread, replying
  // in one or being the author of the message it's under follows it, until
  // you unfollow it.
  rpc FollowThread(FollowThreadRequest) returns (FollowThreadResponse);
  // The threads you follow in a server, the latest reply first, up to 500.
  rpc ListFollowedThreads(ListFollowedThreadsRequest) returns (ListFollowedThreadsResponse);
  // Votes in a poll, replacing the caller's earlier vote: no answers takes
  // it back. Needs to see the channel; refused once the poll has ended.
  rpc VotePoll(VotePollRequest) returns (VotePollResponse);
  // Ends a poll before its time. Its creator, or someone with
  // MANAGE_MESSAGES in its channel.
  rpc EndPoll(EndPollRequest) returns (EndPollResponse);
  // Who voted for one answer of a poll whose votes are public. Refused for
  // anonymous polls, whoever asks.
  rpc ListPollVoters(ListPollVotersRequest) returns (ListPollVotersResponse);
}

message SendMessageRequest {
  string server_id = 1;
  string channel_id = 2;
  string content = 3;
  // Up to 10 files uploaded for this server (MEDIA_PURPOSE_ATTACHMENT), each
  // by its `url` and `filename` (and `width` and `height` for pictures and
  // videos). Needs ATTACH_FILES. Not yet in channels shared from another
  // server.
  repeated Attachment attachments = 4;
  repeated Embed embeds = 5;
  string reply_to_id = 6;
  // Emoji from other servers the caller is a member of on this instance,
  // written in content as <:name:id>: id, server_id, name and url are read.
  // Each is checked (the caller is in that server, and the url is one of its
  // emoji's pictures here); ones that aren't, or that content doesn't use,
  // are left out and show as their names. See Message.emojis.
  repeated Emoji emojis = 7;
  // Reply in the thread under this message, starting it if there's none
  // yet (that needs CREATE_THREADS).
  string thread_id = 8;
  // With thread_id: show the reply in the channel too.
  bool also_send_to_channel = 9;
  // Makes the message a poll; its text may then be empty. Needs
  // CREATE_POLLS. Not in direct messages, secure channels or channels
  // shared with other servers.
  // (7 is the emoji picker's, 8 and 9 are threads'.)
  NewPoll poll = 10;
  // A GIF, as GifService.PrepareGif or ListSavedGifs gave it (sealed).
  // Needs ATTACH_FILES. Not in channels shared from another server yet.
  MessageGif gif = 11;
}

// A poll as its creator writes it.
message NewPoll {
  // 1 to 300 characters.
  string question = 1;
  // 2 to 10, each 1 to 55 characters.
  repeated NewPollAnswer answers = 2;
  // People may pick more than one answer.
  bool multiple = 3;
  // Other members, moderators and admins never see who voted for what, and
  // the counts per answer show only once it ends. The instance's operator
  // could still work out votes from its database while the poll runs; when
  // it ends they're removed from the live tables and only the counts stay
  // (backups and the file's log can hold them for a while after).
  bool anonymous = 4;
  // How long it runs, 1 to 336 hours (two weeks). 0 runs until it's ended.
  int32 duration_hours = 5;
}

message NewPollAnswer {
  string text = 1;
  // One emoji: the character itself, or a server emoji as <:name:id>.
  string emoji = 2;
}

message SendMessageResponse {
  Message message = 1;
}

message GetMessageRequest {
  string server_id = 1;
  string message_id = 2;
  // The channel it's in. Needed for a message in a channel shared from
  // another server, which this server doesn't hold.
  string channel_id = 3;
}

message GetMessageResponse {
  Message message = 1;
  User author = 2;
}

message ListMessagesRequest {
  string server_id = 1;
  string channel_id = 2;
  // 1 to 100; defaults to 50.
  int32 limit = 3;
  // The page right before this message. With neither cursor set, the latest page.
  string before_id = 4;
  // The page right after this message.
  string after_id = 5;
  // A page of the replies in the thread under this message instead.
  string thread_id = 6;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  // Profiles of everyone who wrote a message on this page.
  repeated User authors = 2;
  // Whether there are more messages beyond this page, in the direction paged.
  bool has_more = 3;
  // With thread_id: the message the thread is under.
  Message parent = 4;
}

message UpdateMessageRequest {
  string server_id = 1;
  string message_id = 2;
  string content = 3;
  // The channel it's in. Needed for a message in a channel shared from
  // another server, which this server doesn't hold.
  string channel_id = 4;
  // As in SendMessageRequest. Emoji the message already had stay while the
  // new text still uses them.
  repeated Emoji emojis = 5;
}

message UpdateMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string server_id = 1;
  string message_id = 2;
  // The channel it's in. Needed for a message in a channel shared from
  // another server, which this server doesn't hold.
  string channel_id = 3;
}

message DeleteMessageResponse {}

message ListThreadsRequest {
  string server_id = 1;
  string channel_id = 2;
  // Only threads whose parent or replies say this, ignoring case. Up to 100
  // characters.
  string query = 3;
  // Archived threads instead of open ones (Server.thread_archive_hours).
  bool archived = 4;
  // 1 to 50; defaults to 25.
  int32 limit = 5;
  // The page after this thread (its parent's id), from the last page.
  string after_thread_id = 6;
}

message ListThreadsResponse {
  // The messages the threads are under, each with its summary.
  repeated Message threads = 1;
  // Profiles of their authors and the threads' participants.
  repeated User authors = 2;
  bool has_more = 3;
  // With has_more: the after_thread_id for the next page. A search can stop
  // before it finds anything, with has_more and a place to carry on from.
  string next_after_thread_id = 4;
}

message UpdateThreadRequest {
  string server_id = 1;
  string channel_id = 2;
  // The message the thread is under.
  string thread_id = 3;
  optional bool locked = 4;
}

message UpdateThreadResponse {
  ThreadSummary thread = 1;
}

message FollowThreadRequest {
  string server_id = 1;
  string channel_id = 2;
  string thread_id = 3;
  bool follow = 4;
}

message FollowThreadResponse {}

message ListFollowedThreadsRequest {
  string server_id = 1;
}

message ListFollowedThreadsResponse {
  // The ids of the messages the threads are under.
  repeated string thread_ids = 1;
}

message VotePollRequest {
  string server_id = 1;
  string message_id = 2;
  // The answers picked: one, or several in a multiple-choice poll. Empty
  // takes the vote back.
  repeated uint32 answer_ids = 3;
}

message VotePollResponse {
  // With the caller's own answers in my_answer_ids.
  Poll poll = 1;
}

message EndPollRequest {
  string server_id = 1;
  string message_id = 2;
}

message EndPollResponse {
  Poll poll = 1;
}

message ListPollVotersRequest {
  string server_id = 1;
  string message_id = 2;
  uint32 answer_id = 3;
  // 1 to 100; defaults to 50.
  int32 limit = 4;
  // The page after this voter (a user id), in the order they're listed.
  string after_id = 5;
}

message ListPollVotersResponse {
  repeated User users = 1;
  bool has_more = 2;
}
