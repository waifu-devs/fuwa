syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/sso.proto";
import "fuwa/v1/types.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Instance administration: settings, accounts, every server with its usage and
// caps, and the announcement banner. Callable by instance admins, or with the
// operator's FUWA_ADMIN_TOKEN (for a control plane such as the one behind the
// hosted tiers).
service AdminService {
  // The instance's settings, where each one comes from, and how the process was started.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Changes settings, or returns them to their defaults. Takes effect at once
  // and survives restarts.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc GetNodeUsage(GetNodeUsageRequest) returns (GetNodeUsageResponse);
  // Replaces a server's own caps. Unset fields fall back to the instance defaults.
  rpc SetServerLimits(SetServerLimitsRequest) returns (SetServerLimitsResponse);

  // Accounts on this instance, newest first, a page at a time.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // Makes an account an instance admin or takes that away, or turns the
  // account off or back on. A turned-off account can't sign in and its devices
  // are signed out. Admins can't change their own account here, and the last
  // admin stays one.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  // Gives a standalone account a new random password, shown once, and signs
  // out its devices. Optionally turns off its two-step sign-in too, for
  // someone who lost their authenticator.
  rpc ResetAccountPassword(ResetAccountPasswordRequest) returns (ResetAccountPasswordResponse);

  // Every community server on the instance, with its owner, usage and caps,
  // members or not.
  rpc ListInstanceServers(ListInstanceServersRequest) returns (ListInstanceServersResponse);
  // A copy of a server's database as a plain SQLite file any SQLite tool can
  // open, sent in pieces. It is never encrypted, even when the instance
  // encrypts its files.
  rpc ExportServer(ExportServerRequest) returns (stream ExportServerResponse);

  // Puts a banner on every client of this instance, or takes it down.
  rpc SetAnnouncement(SetAnnouncementRequest) returns (SetAnnouncementResponse);
}

// Everything about an instance an admin can change while it runs. Each setting
// starts from its FUWA_* environment variable (or a built-in default); a value
// set through UpdateSettings is stored in the instance's database and wins.
message InstanceSettings {
  // FUWA_NODE_NAME.
  string name = 1;
  // The URL clients reach this instance on. FUWA_PUBLIC_URL.
  string public_url = 2;
  // Browser origins allowed to call the API, or just "*" for any.
  // FUWA_ALLOWED_ORIGINS.
  repeated string allowed_origins = 3;
  // FUWA_LOCAL_ACCOUNTS.
  LocalAccounts local_accounts = 4;
  // FUWA_SERVER_CREATION.
  ServerCreation server_creation = 5;
  // Servers one account may own; unset for no cap. FUWA_LIMIT_SERVERS_PER_ACCOUNT.
  optional int64 servers_per_account = 6;
  // Caps every server gets unless it has its own; unset fields for no cap.
  // FUWA_LIMIT_MEMBERS, _CHANNELS, _STORAGE and _ATTACHMENT_STORAGE.
  ServerLimits default_limits = 7;
  // The anonymous usage signal. FUWA_TELEMETRY (DO_NOT_TRACK=1 also turns it off).
  bool telemetry = 8;
  // Serve the web app at this instance's address. FUWA_WEB.
  bool web = 9;
  // The largest picture (avatar, banner, server icon) one upload may be;
  // unset for no cap. FUWA_LIMIT_PICTURE_UPLOAD, 8 MiB unless set.
  optional int64 picture_upload_bytes = 10;
  // FUWA_LINKED_ACCOUNTS.
  LinkedAccounts linked_accounts = 11;
  // Where linked accounts sign in: an OpenAuth issuer, https://api.waifu.dev
  // unless changed. Accounts already linked keep the issuer they came from.
  // FUWA_LINKED_ISSUER.
  string linked_issuer = 12;
  // Voice channels and direct-message calls. FUWA_CALLS.
  bool calls = 20;
  // STUN and TURN servers apps reach the media part through, as stun:,
  // turn: or turns: URLs. FUWA_ICE_URLS.
  repeated string ice_urls = 21;
  // The secret shared with the TURN servers (coturn's static-auth-secret),
  // which makes each caller a credential that expires. FUWA_TURN_SECRET.
  string turn_secret = 22;
  // People with RECORD may record voice channels on the server: everyone's
  // sound is kept, one track per person, in the shard's data directory (and
  // its replica). Recording on one's own device is always up to them.
  // FUWA_CALL_RECORDINGS.
  bool call_recordings = 23;
  // Days a finished server recording is kept before it deletes itself;
  // unset keeps them until someone deletes them.
  // FUWA_CALL_RECORDINGS_KEEP_DAYS.
  optional int64 call_recordings_keep_days = 24;
  // Who may make agents (bot accounts). Agents already made keep working.
  // FUWA_AGENT_CREATION.
  AgentCreation agent_creation = 13;
  // How many bytes of pictures one account may upload in a day (UTC); unset
  // for no cap. FUWA_LIMIT_PICTURE_UPLOADS_PER_DAY, 256 MiB unless set.
  optional int64 picture_upload_bytes_per_day = 14;
  // Signing in through an identity provider the admins set up (single
  // sign-on). Off unless changed. FUWA_SSO_ACCOUNTS.
  SsoAccounts sso_accounts = 15;
  // The provider for sso_accounts. Its client secret is never sent back.
  IdentityProvider sso_provider = 16;
}

// Whether accounts that sign in through the instance's identity provider work.
enum SsoAccounts {
  SSO_ACCOUNTS_UNSPECIFIED = 0;
  // Anyone the provider signs in gets an account here.
  SSO_ACCOUNTS_OPEN = 1;
  // Only people who already have such an account can sign in.
  SSO_ACCOUNTS_CLOSED = 2;
  // No single sign-on.
  SSO_ACCOUNTS_OFF = 3;
}

// Whether standalone accounts (a username and password kept on the instance) work.
enum LocalAccounts {
  LOCAL_ACCOUNTS_UNSPECIFIED = 0;
  // Anyone can sign up.
  LOCAL_ACCOUNTS_OPEN = 1;
  // Existing accounts can sign in; nobody new can sign up.
  LOCAL_ACCOUNTS_CLOSED = 2;
  // No standalone accounts.
  LOCAL_ACCOUNTS_OFF = 3;
}

// Whether linked accounts (signed in with waifu.dev) work.
enum LinkedAccounts {
  LINKED_ACCOUNTS_UNSPECIFIED = 0;
  // Anyone with a waifu.dev account can sign in, and gets an account here.
  LINKED_ACCOUNTS_OPEN = 1;
  // Linked accounts that exist can sign in; nobody new can.
  LINKED_ACCOUNTS_CLOSED = 2;
  // No signing in with waifu.dev.
  LINKED_ACCOUNTS_OFF = 3;
}

// How the process was started. These come only from the environment, since
// changing them means restarting or moving the instance.
message StartupSettings {
  // FUWA_PORT.
  int32 port = 1;
  // Whether FUWA_ENCRYPTION_KEY encrypts the databases at rest.
  bool encryption = 2;
  // Whether FUWA_ADMIN_TOKEN is set.
  bool admin_token = 3;
  // Whether this build carries the web app at all.
  bool web_built_in = 4;
  // FUWA_TELEMETRY_URL.
  string telemetry_url = 5;
  // FUWA_HOSTING.
  bool hosted = 6;
  string version = 7;
  // Where the media part takes calls: its UDP and TCP port (FUWA_MEDIA_PORT)
  // and the addresses it gives apps (FUWA_MEDIA_ADDRESSES), or nothing when
  // it isn't running in this process (a split instance's media parts).
  int32 media_port = 20;
  repeated string media_addresses = 21;
}

message InstanceConfig {
  // The settings in force.
  InstanceSettings settings = 1;
  // What each setting is without changes made through UpdateSettings.
  InstanceSettings defaults = 2;
  // The settings changed through UpdateSettings, as field paths such as
  // "name" or "default_limits.members".
  repeated string overridden = 3;
  StartupSettings startup = 4;
  // What to tell the identity provider about this instance.
  ServiceProvider sso_service_provider = 5;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  InstanceConfig config = 1;
}

message UpdateSettingsRequest {
  // New values; only the fields named in update_mask are read.
  InstanceSettings settings = 1;
  // The settings to change, such as "name" or "default_limits.members"
  // ("default_limits" means all four).
  google.protobuf.FieldMask update_mask = 2;
  // The settings to return to their defaults.
  google.protobuf.FieldMask reset_mask = 3;
}

message UpdateSettingsResponse {
  InstanceConfig config = 1;
}

message GetNodeUsageRequest {}

message GetNodeUsageResponse {
  int64 accounts = 1;
  int64 servers = 2;
  repeated ServerUsage server_usage = 3;
  // The instance-wide defaults every server gets unless it has its own.
  ServerLimits default_limits = 4;
  // Pictures people uploaded and still use (avatars, banners, server icons).
  int64 pictures = 5;
  int64 picture_bytes = 6;
}

message SetServerLimitsRequest {
  string server_id = 1;
  ServerLimits limits = 2;
}

message SetServerLimitsResponse {
  // The caps now in force.
  ServerLimits limits = 1;
}

// ───────────────────────── Accounts ─────────────────────────

// An account as instance admins see it.
message AccountSummary {
  User user = 1;
  bool admin = 2;
  // Turned off by an admin: it can't sign in.
  bool disabled = 3;
  // Why, as the admin put it. Only admins see it.
  string disabled_reason = 4;
  google.protobuf.Timestamp disabled_at = 5;
  bool two_factor = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_seen_at = 8;
  // Devices signed in right now.
  int32 sessions = 9;
  // Servers it's a member of, and how many of those it owns.
  int32 servers = 10;
  int32 servers_owned = 11;
}

enum AccountFilter {
  // Every account.
  ACCOUNT_FILTER_UNSPECIFIED = 0;
  ACCOUNT_FILTER_ADMINS = 1;
  ACCOUNT_FILTER_DISABLED = 2;
}

message ListAccountsRequest {
  // Matches usernames and display names.
  string query = 1;
  AccountFilter filter = 2;
  // For the next page: the id of the last account on the page before.
  string before_id = 3;
  // At most this many; 50 when unset, and never more than 200.
  int32 limit = 4;
}

message ListAccountsResponse {
  repeated AccountSummary accounts = 1;
  bool has_more = 2;
  // Across the whole instance, whatever the query and filter.
  AccountTotals totals = 3;
}

message AccountTotals {
  int64 all = 1;
  int64 admins = 2;
  int64 disabled = 3;
}

message UpdateAccountRequest {
  string account_id = 1;
  optional bool admin = 2;
  optional bool disabled = 3;
  // Why it's being turned off, up to 512 characters. Only admins see it.
  string reason = 4;
}

message UpdateAccountResponse {
  AccountSummary account = 1;
}

message ResetAccountPasswordRequest {
  string account_id = 1;
  bool turn_off_two_factor = 2;
}

message ResetAccountPasswordResponse {
  // The new password. It isn't kept anywhere readable, so this is the only
  // time it can be shown.
  string password = 1;
}

// ───────────────────────── Servers ─────────────────────────

// A community server as instance admins see it.
message InstanceServer {
  Server server = 1;
  User owner = 2;
  ServerUsage usage = 3;
  // The caps in force, the server's own or the instance defaults.
  ServerLimits limits = 4;
  // Whether the caller is a member, and can open its own settings.
  bool member = 5;
}

message ListInstanceServersRequest {}

message ListInstanceServersResponse {
  repeated InstanceServer servers = 1;
}

message ExportServerRequest {
  string server_id = 1;
}

// One piece of an exported file. The first also says what the whole is.
message ExportServerResponse {
  bytes chunk = 1;
  // The whole file's size in bytes. First piece only.
  int64 size = 2;
  // A name to save it under. First piece only.
  string filename = 3;
}

// ───────────────────────── Announcement ─────────────────────────

message SetAnnouncementRequest {
  // Empty text takes the banner down.
  Announcement announcement = 1;
}

message SetAnnouncementResponse {
  // What clients now show, if anything.
  Announcement announcement = 1;
}
