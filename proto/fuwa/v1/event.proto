syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/types.proto";

// Each community server's event log, live or from history.
service EventService {
  // Streams events from any number of the caller's servers on this instance, as
  // they happen. A cursor with `after_sequence` set first replays everything
  // after it, so a client that reconnects with its last sequence misses nothing.
  // Once any replay is done the stream sends `ready`; after that come live
  // events. A response with neither set is a heartbeat. A server that was
  // deleted, or that the caller is no longer in, comes first as a
  // ServerDeleted or MemberLeft event with sequence 0, and isn't followed.
  // Events about channels the caller can't see are left out; when their
  // permissions change, channels they can now see come as ChannelCreated and
  // ones they no longer can as ChannelDeleted, both with sequence 0. A replay
  // goes by what the caller can see now, so after one a client lists the
  // server's channels again to pick up access that changed while it was away.
  // With `follow_new_servers`, a server the caller joins or is added to while
  // the stream is open is followed from then on, announced by `followed`. A
  // session that's signed out, or an agent token that's reset, ends its
  // streams at once with UNAUTHENTICATED.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  // A server's log, leaving out events about channels the caller can't see now
  // (but keeping every ChannelDeleted).
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}

message ServerCursor {
  string server_id = 1;
  // Replay events after this sequence (0 replays from the start). Unset: only new events.
  optional int64 after_sequence = 2;
}

message SubscribeRequest {
  // Up to 200. May be empty with `follow_new_servers`, for a stream that only
  // waits to be added somewhere (an agent with no servers yet, say).
  repeated ServerCursor servers = 1;
  // Also follow servers the caller joins, or is added to, while the stream is
  // open (up to 200 in all).
  bool follow_new_servers = 2;
}

message SubscribeResponse {
  Event event = 1;
  SubscribeReady ready = 2;
  // A server the caller joined, or was added to, now followed: its events
  // after this sequence come next. Only with `follow_new_servers`.
  ServerHead followed = 3;
}

// Sent once per stream, when it is live.
message SubscribeReady {
  // Where each followed server stands: the last event replayed, or for a
  // cursor without `after_sequence`, the last event committed before the
  // stream started. Every later event has a higher sequence, so a client can
  // load a server's current state after `ready` and then apply what follows.
  repeated ServerHead servers = 1;
}

message ServerHead {
  string server_id = 1;
  int64 sequence = 2;
}

message ListEventsRequest {
  string server_id = 1;
  int64 after_sequence = 2;
  // 1 to 500; defaults to 100.
  int32 limit = 3;
}

message ListEventsResponse {
  repeated Event events = 1;
  bool has_more = 2;
}
