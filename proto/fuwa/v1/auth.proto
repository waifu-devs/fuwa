syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/sso.proto";
import "fuwa/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Accounts on this instance. Signing up or in returns a session token, which
// every other call sends as `authorization: Bearer <token>`.
service AuthService {
  // Creates a standalone account. The first account on an instance becomes its admin.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  // Signs in with a username and password. For an account with two-step
  // sign-in on, the answer carries a ticket instead of a token: send it to
  // VerifyTwoFactor with a code to finish.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc VerifyTwoFactor(VerifyTwoFactorRequest) returns (VerifyTwoFactorResponse);
  // Ends the session the call was made with.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Someone's profile: your own, anyone who shares a server with you, or
  // anyone for instance admins.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // Signing in with a waifu.dev account (a linked account) takes three calls.
  // StartLinkedSignIn returns the address to send the browser to. waifu.dev
  // sends it back to this instance's /auth/waifu/callback with a code, and
  // FinishLinkedSignIn trades that code for a session. Someone new gets a
  // linked account here, while linked sign-ups are open.
  rpc StartLinkedSignIn(StartLinkedSignInRequest) returns (StartLinkedSignInResponse);
  // Which app a sign-in that came back to this instance belongs to, so the
  // callback page can hand it on when another fuwa app started it.
  rpc GetLinkedSignIn(GetLinkedSignInRequest) returns (GetLinkedSignInResponse);
  rpc FinishLinkedSignIn(FinishLinkedSignInRequest) returns (FinishLinkedSignInResponse);

  // Single sign-on through the identity provider the instance's admins set
  // up (InstanceSettings.sso_provider), in three calls too. The provider
  // sends the browser back to this instance (/sso/instance/...), which checks
  // who signed in and sends it on to
  //   <public URL>/auth/sso/done#state=<state>&code=<code>
  // and FinishSsoSignIn trades the code for a session. Someone new gets an
  // account here while SSO sign-ups are open. With `test`, an instance admin
  // checks the provider works: Finish says who signed in and changes nothing.
  rpc StartSsoSignIn(StartSsoSignInRequest) returns (StartSsoSignInResponse);
  rpc GetSsoSignIn(GetSsoSignInRequest) returns (GetSsoSignInResponse);
  rpc FinishSsoSignIn(FinishSsoSignInRequest) returns (FinishSsoSignInResponse);
}

message SignUpRequest {
  string username = 1;
  string password = 2;
  // Defaults to the username.
  string display_name = 3;
}

message SignUpResponse {
  string token = 1;
  User user = 2;
  bool admin = 3;
}

message SignInRequest {
  string username = 1;
  string password = 2;
}

message SignInResponse {
  string token = 1;
  User user = 2;
  bool admin = 3;
  // Set, with nothing else, when the account needs a code from an
  // authenticator app (or a backup code) too. Good for five minutes.
  string two_factor_ticket = 4;
}

message VerifyTwoFactorRequest {
  string ticket = 1;
  // Six digits from the authenticator app, or one of the backup codes.
  string code = 2;
}

message VerifyTwoFactorResponse {
  string token = 1;
  User user = 2;
  bool admin = 3;
}

message SignOutRequest {}

message SignOutResponse {}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
  // Instance admins can moderate every server here and read its usage.
  bool admin = 2;
}

message UpdateProfileRequest {
  optional string display_name = 1;
  optional string avatar_url = 2;
  optional string pronouns = 3;
  // Markdown.
  optional string bio = 4;
  optional string banner_url = 5;
  // 0xRRGGBB, or -1 to let clients pick.
  optional int32 accent_color = 6;
  // Setting the status replaces its expiry too: unset keeps it until changed.
  optional string status = 7;
  google.protobuf.Timestamp status_expires_at = 8;
  // A profile effect's id (lowercase letters, digits and dashes, up to 32),
  // or empty for none. Refused while the instance has profile effects off,
  // except clearing it.
  optional string effect = 9;
}

message UpdateProfileResponse {
  User user = 1;
  Profile profile = 2;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  Profile profile = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message StartLinkedSignInRequest {
  // The origin of the app signing in, like https://chat.example.com. The
  // sign-in ends at <return_origin>/auth/waifu/callback.
  string return_origin = 1;
  // The SHA-256 (hex) of a random secret the app keeps until FinishLinkedSignIn,
  // so only the app that started a sign-in can finish it.
  string secret_hash = 2;
}

message StartLinkedSignInResponse {
  // Where to send the browser: the issuer's sign-in page.
  string authorize_url = 1;
  // Comes back with the code; good for ten minutes.
  string state = 2;
}

message GetLinkedSignInRequest {
  string state = 1;
}

message GetLinkedSignInResponse {
  // The app that started the sign-in.
  string return_origin = 1;
}

message FinishLinkedSignInRequest {
  string state = 1;
  // The code the issuer sent back.
  string code = 2;
  // The secret whose hash started the sign-in.
  string secret = 3;
}

message FinishLinkedSignInResponse {
  string token = 1;
  User user = 2;
  bool admin = 3;
  // Whether this sign-in made the account.
  bool created = 4;
}

message StartSsoSignInRequest {
  // The origin of the app signing in. The sign-in ends at
  // <return_origin>/auth/sso/done.
  string return_origin = 1;
  // The SHA-256 (hex) of a random secret the app keeps until FinishSsoSignIn.
  string secret_hash = 2;
  // An instance admin checking the provider: works while sso_accounts is
  // off, and signs nobody in.
  bool test = 3;
}

message StartSsoSignInResponse {
  string authorize_url = 1;
  string state = 2;
}

message GetSsoSignInRequest {
  string state = 1;
}

message GetSsoSignInResponse {
  string return_origin = 1;
  string provider_name = 2;
  bool test = 3;
}

message FinishSsoSignInRequest {
  string state = 1;
  string code = 2;
  string secret = 3;
}

message FinishSsoSignInResponse {
  // Empty for a test.
  string token = 1;
  User user = 2;
  bool admin = 3;
  bool created = 4;
  // Who the provider signed in.
  SsoIdentity identity = 5;
}
