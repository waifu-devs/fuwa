syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Community servers on this instance.
service ServerService {
  // Creates a server with a #general channel; the caller owns it.
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  rpc GetServer(GetServerRequest) returns (GetServerResponse);
  // The servers the caller is a member of.
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  // Servers anyone on this instance can find and join.
  rpc DiscoverServers(DiscoverServersRequest) returns (DiscoverServersResponse);
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse);
  // Deletes the server and its database. Owner or instance admin only.
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse);
  // Joins a discoverable server, or any server with one of its invites.
  // Servers that take applications are joined through JoinService instead.
  rpc JoinServer(JoinServerRequest) returns (JoinServerResponse);
  rpc LeaveServer(LeaveServerRequest) returns (LeaveServerResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // Changes a member's nickname: your own with CHANGE_NICKNAME, someone
  // ranked below you with MANAGE_NICKNAMES. Roles change through RoleService.
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse);
  // What the server uses and the caps on it. MANAGE_SERVER or instance admins.
  rpc GetServerUsage(GetServerUsageRequest) returns (GetServerUsageResponse);

  // Moderation, with KICK_MEMBERS, BAN_MEMBERS or TIME_OUT_MEMBERS, on
  // people ranked below the caller.

  // Stops a member sending messages for a while.
  rpc TimeOutMember(TimeOutMemberRequest) returns (TimeOutMemberResponse);
  // Removes a member. They can join again.
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse);
  // Removes someone who is or was a member and keeps them out.
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  rpc ListBans(ListBansRequest) returns (ListBansResponse);
  // Who changed what in the server, newest first. VIEW_AUDIT_LOG.
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse);
  // Hands the server to another member. Owner only; they keep their roles.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
}

message CreateServerRequest {
  string name = 1;
  string description = 2;
  string icon_url = 3;
  bool discoverable = 4;
  // One of Node.regions' ids, where the server's data will be kept. Empty
  // for the home region.
  string region = 5;
}

message CreateServerResponse {
  Server server = 1;
}

message GetServerRequest {
  string server_id = 1;
}

message GetServerResponse {
  Server server = 1;
}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message DiscoverServersRequest {}

message DiscoverServersResponse {
  repeated Server servers = 1;
}

message UpdateServerRequest {
  string server_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string icon_url = 4;
  optional bool discoverable = 5;
  // Unset, ALL or MENTIONS.
  optional NotificationLevel default_notifications = 6;
  // A text channel, or empty to post no system messages.
  optional string system_channel_id = 7;
  optional int32 min_account_age_seconds = 8;
  optional bool applications = 9;
  optional bool linked_only = 10;
  // 0 to 8760 (a year); 0 never archives threads.
  optional int32 thread_archive_hours = 11;
}

message UpdateServerResponse {
  Server server = 1;
}

message DeleteServerRequest {
  string server_id = 1;
}

message DeleteServerResponse {}

message JoinServerRequest {
  string server_id = 1;
  // An invite into the server, needed unless it's discoverable.
  string invite_code = 2;
}

message JoinServerResponse {
  Server server = 1;
  Member member = 2;
}

message LeaveServerRequest {
  string server_id = 1;
}

message LeaveServerResponse {}

message ListMembersRequest {
  string server_id = 1;
}

message ListMembersResponse {
  // Highest ranked first.
  repeated Member members = 1;
}

message UpdateMemberRequest {
  string server_id = 1;
  string user_id = 2;
  // Empty clears it.
  optional string nickname = 3;
  reserved 4;
  reserved "role";
}

message UpdateMemberResponse {
  Member member = 1;
}

message GetServerUsageRequest {
  string server_id = 1;
}

message GetServerUsageResponse {
  ServerUsage usage = 1;
  // The caps in force: the server's own, else the instance defaults.
  ServerLimits limits = 2;
  // The server's own caps; unset fields follow the instance defaults.
  ServerLimits own_limits = 3;
}

message TimeOutMemberRequest {
  string server_id = 1;
  string user_id = 2;
  // Up to 28 days. Zero ends a time-out early.
  int64 seconds = 3;
  // Kept in the audit log.
  string reason = 4;
}

message TimeOutMemberResponse {
  Member member = 1;
}

message KickMemberRequest {
  string server_id = 1;
  string user_id = 2;
  string reason = 3;
}

message KickMemberResponse {}

message BanMemberRequest {
  string server_id = 1;
  string user_id = 2;
  string reason = 3;
  // Also deletes what they sent in this many seconds before the ban, up to
  // seven days. Zero keeps their messages.
  int64 delete_message_seconds = 4;
}

message BanMemberResponse {
  Ban ban = 1;
  // How many of their messages went with them.
  int64 deleted_messages = 2;
}

message UnbanMemberRequest {
  string server_id = 1;
  string user_id = 2;
}

message UnbanMemberResponse {}

message ListBansRequest {
  string server_id = 1;
}

message ListBansResponse {
  // Newest first.
  repeated Ban bans = 1;
  // Whoever banned them, for names.
  repeated User moderators = 2;
}

message Ban {
  User user = 1;
  string reason = 2;
  string banned_by_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListAuditLogRequest {
  string server_id = 1;
  // 1 to 100; defaults to 50.
  int32 limit = 2;
  // The page right before this entry. Empty for the newest.
  string before_id = 3;
  // Only what this person did.
  string actor_id = 4;
  // Only this kind of action.
  AuditAction action = 5;
}

message ListAuditLogResponse {
  // Newest first.
  repeated AuditEntry entries = 1;
  // Everyone the entries name, as actor or target, for names and faces.
  repeated User users = 2;
  bool has_more = 3;
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_SERVER_UPDATE = 1;
  AUDIT_ACTION_CHANNEL_CREATE = 2;
  AUDIT_ACTION_CHANNEL_UPDATE = 3;
  AUDIT_ACTION_CHANNEL_DELETE = 4;
  AUDIT_ACTION_CHANNELS_REORDER = 5;
  // A nickname set by someone else.
  AUDIT_ACTION_MEMBER_UPDATE = 6;
  AUDIT_ACTION_MEMBER_TIME_OUT = 7;
  AUDIT_ACTION_MEMBER_KICK = 8;
  AUDIT_ACTION_MEMBER_BAN = 9;
  AUDIT_ACTION_MEMBER_UNBAN = 10;
  // Someone else's message, deleted by a moderator.
  AUDIT_ACTION_MESSAGE_DELETE = 11;
  AUDIT_ACTION_OWNERSHIP_TRANSFER = 12;
  // Role actions name the role as their target.
  AUDIT_ACTION_ROLE_CREATE = 13;
  AUDIT_ACTION_ROLE_UPDATE = 14;
  AUDIT_ACTION_ROLE_DELETE = 15;
  AUDIT_ACTION_ROLES_REORDER = 16;
  // A role handed to or taken from a member; the change names the role.
  AUDIT_ACTION_MEMBER_ROLES_UPDATE = 17;
  AUDIT_ACTION_CHANNEL_PERMISSIONS_UPDATE = 18;
  // Invite actions have the invite's code as their target.
  AUDIT_ACTION_INVITE_CREATE = 19;
  AUDIT_ACTION_INVITE_DELETE = 20;
  // Application actions name the applicant as their target.
  AUDIT_ACTION_APPLICATION_APPROVE = 21;
  AUDIT_ACTION_APPLICATION_REJECT = 22;
  // The rules or questions changed.
  AUDIT_ACTION_JOIN_FORM_UPDATE = 23;
  AUDIT_ACTION_WELCOME_SCREEN_UPDATE = 24;
  // AutoMod actions have the rule's id as their target; the change names it.
  AUDIT_ACTION_AUTO_MOD_RULE_CREATE = 25;
  AUDIT_ACTION_AUTO_MOD_RULE_UPDATE = 26;
  AUDIT_ACTION_AUTO_MOD_RULE_DELETE = 27;
  // AutoMod timed someone out: they're both actor and target, and the
  // reason names the rule.
  AUDIT_ACTION_AUTO_MOD_TIME_OUT = 28;
  // Emoji actions have the emoji's id as their target; the change names it.
  AUDIT_ACTION_EMOJI_CREATE = 29;
  AUDIT_ACTION_EMOJI_UPDATE = 30;
  AUDIT_ACTION_EMOJI_DELETE = 31;
  // Webhook actions have the webhook's id as their target and its channel's
  // name; the change names it. Resetting its address is an update of
  // "token", with no values.
  AUDIT_ACTION_WEBHOOK_CREATE = 32;
  AUDIT_ACTION_WEBHOOK_UPDATE = 33;
  AUDIT_ACTION_WEBHOOK_DELETE = 34;
  // Someone added an agent: it's the target.
  AUDIT_ACTION_AGENT_ADD = 35;
  // Shared channels (SharedChannelService). Code actions have the code as
  // their target; connection actions the other server's id, with the
  // channel's name, and the change names the other server.
  AUDIT_ACTION_SHARE_CODE_CREATE = 40;
  AUDIT_ACTION_SHARE_CODE_DELETE = 41;
  // This server asked to show another server's channel.
  AUDIT_ACTION_SHARED_CHANNEL_REQUEST = 42;
  AUDIT_ACTION_SHARED_CHANNEL_APPROVE = 43;
  // Ended from either side, or a request turned down or withdrawn.
  AUDIT_ACTION_SHARED_CHANNEL_DISCONNECT = 44;
  AUDIT_ACTION_SHARED_CHANNEL_UPDATE = 45;
  // Someone from another server kept out of a shared channel, or let back:
  // they're the target.
  AUDIT_ACTION_SHARED_CHANNEL_BLOCK = 46;
  AUDIT_ACTION_SHARED_CHANNEL_UNBLOCK = 47;
  // AutoMod took a message down after it was sent, when its provider's
  // answer came late: the author is both actor and target, the channel is
  // where it was, and the reason names the rule.
  AUDIT_ACTION_AUTO_MOD_MESSAGE_DELETE = 48;
  // A moderator locked a thread, unlocked one, or deleted one with its
  // replies. The target is the author of the message it's under.
  AUDIT_ACTION_THREAD_LOCK = 49;
  AUDIT_ACTION_THREAD_UNLOCK = 50;
  AUDIT_ACTION_THREAD_DELETE = 51;
  // Someone else's poll, ended early by a moderator: its creator is the
  // target. Votes are never recorded.
  AUDIT_ACTION_POLL_END = 52;
}

// One thing someone did with a moderator's or manager's permission.
message AuditEntry {
  string id = 1;
  string actor_id = 2;
  AuditAction action = 3;
  // A user for member and message actions, a channel for channel actions,
  // a role for role actions, empty for the server itself.
  string target_id = 4;
  // The channel's name at the time, for channel actions and deleted messages.
  string channel_name = 5;
  string reason = 6;
  // What changed, for updates.
  repeated AuditChange changes = 7;
  google.protobuf.Timestamp created_at = 8;
  // The role's name at the time, for role actions and roles handed out.
  string role_name = 9;
}

// One field before and after. Values are text: numbers and times (unix
// milliseconds) as digits, flags as "true" or "false", enums as their number.
message AuditChange {
  string field = 1;
  string before = 2;
  string after = 3;
}

message TransferOwnershipRequest {
  string server_id = 1;
  string user_id = 2;
}

message TransferOwnershipResponse {
  Server server = 1;
}
