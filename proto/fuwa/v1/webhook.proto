syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/types.proto";

// A server's webhooks: addresses other apps post messages to, each into one
// channel, with no account. MANAGE_WEBHOOKS for all of these. Changes are
// audit-only: members aren't sent an event.
//
// A webhook posts with an HTTP POST to
//   <instance>/webhooks/<server id>/<webhook id>/<token>
// with a JSON body shaped like Discord's, so tools that post to Discord
// webhooks work unchanged:
//   {"content": "...", "username": "...", "avatar_url": "https://...",
//    "embeds": [{"title", "description", "url", "color",
//                "fields": [{"name", "value"}], "thumbnail": {"url"},
//                "image": {"url"}}]}
// It answers 204, or 200 with the message as JSON with ?wait=true. Each
// webhook may post 30 messages a minute; past that it answers 429 with
// Retry-After. Webhook messages never ping @everyone, @here or roles.
service WebhookService {
  // The server's webhooks, oldest first, tokens included.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  // Renames it, changes its picture or moves it to another channel.
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  // A new token: the old address stops working at once.
  rpc ResetWebhookToken(ResetWebhookTokenRequest) returns (ResetWebhookTokenResponse);
  // The messages it posted stay.
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
}

message ListWebhooksRequest {
  string server_id = 1;
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
  // Profiles of the people who made them.
  repeated User creators = 2;
}

message CreateWebhookRequest {
  string server_id = 1;
  string channel_id = 2;
  // 1 to 80 characters.
  string name = 3;
  // Empty, or a picture the caller uploaded for it (MEDIA_PURPOSE_AVATAR).
  string avatar_url = 4;
}

message CreateWebhookResponse {
  Webhook webhook = 1;
}

message UpdateWebhookRequest {
  string server_id = 1;
  string webhook_id = 2;
  string name = 3;
  // Empty for none, the current picture, or a new upload.
  string avatar_url = 4;
  string channel_id = 5;
}

message UpdateWebhookResponse {
  Webhook webhook = 1;
}

message ResetWebhookTokenRequest {
  string server_id = 1;
  string webhook_id = 2;
}

message ResetWebhookTokenResponse {
  Webhook webhook = 1;
}

message DeleteWebhookRequest {
  string server_id = 1;
  string webhook_id = 2;
}

message DeleteWebhookResponse {}
