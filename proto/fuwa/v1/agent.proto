syntax = "proto3";

package fuwa.v1;

import "fuwa/v1/types.proto";
import "google/protobuf/timestamp.proto";

// Agents: accounts that programs drive (bots, assistants, integrations),
// made and owned by a person. An agent signs in with its token as a bearer
// token and then uses the same API people do: it reads with EventService,
// posts with MessageService, and so on, in the servers it was added to.
//
// Agents have no password, two-step sign-in or devices of their own: the
// token is their only way in, and it never runs out until it's reset. They
// don't join servers by themselves; someone with MANAGE_SERVER adds them
// (AddAgent), and they skip the rules and the account-age check. Removing one
// is kicking it. They can't own servers or use direct messages, and clients
// mark them (User.kind is ACCOUNT_KIND_AGENT).
//
// Who may make agents is the instance's agent_creation setting.
service AgentService {
  // The caller's agents, oldest first.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Makes an agent and its first token.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  // Changes its name, picture, bio or who may add it.
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  // A new token. The old one stops working at once, and the agent is signed
  // out everywhere.
  rpc ResetAgentToken(ResetAgentTokenRequest) returns (ResetAgentTokenResponse);
  // Deletes the agent: it leaves every server, and its messages stay under
  // "Deleted account", as when a person deletes theirs.
  rpc DeleteAgent(DeleteAgentRequest) returns (DeleteAgentResponse);
  // Adds an agent to a server. Needs MANAGE_SERVER there, and the agent must
  // be public or the caller's own.
  rpc AddAgent(AddAgentRequest) returns (AddAgentResponse);
  // Which of a server's agents may use the instance's MCP endpoint
  // (docs/mcp.md). Any member may read it. What an agent can do there is
  // still up to its roles: this only closes the MCP door, and the agent's
  // token keeps working with this API.
  rpc GetMcpAccess(GetMcpAccessRequest) returns (GetMcpAccessResponse);
  // Needs MANAGE_SERVER. Kept in the audit log as a server update of
  // "mcp_access".
  rpc SetMcpAccess(SetMcpAccessRequest) returns (SetMcpAccessResponse);
  // The agent's endpoint (docs/agent-endpoints.md): a URL the instance posts
  // its events to, for agents that don't hold a stream open. Made, with its
  // signing secret, the first time its owner asks.
  rpc GetAgentEndpoint(GetAgentEndpointRequest) returns (GetAgentEndpointResponse);
  // Sets the URL and which events go there, or turns the endpoint off with
  // an empty URL. A URL is saved only once it answers a check (an
  // AgentDelivery with `challenge` set) with that challenge. Deliveries start
  // from the events after this call.
  rpc SetAgentEndpoint(SetAgentEndpointRequest) returns (SetAgentEndpointResponse);
  // A new signing secret. The old one stops being used at once.
  rpc ResetAgentEndpointSecret(ResetAgentEndpointSecretRequest) returns (ResetAgentEndpointSecretResponse);
}

message Agent {
  User user = 1;
  // The person who made it.
  string owner_id = 2;
  // Anyone who manages a server may add it there. Otherwise only its owner can.
  bool public = 3;
  // Markdown, like a person's bio.
  string bio = 4;
  google.protobuf.Timestamp created_at = 5;
  // When it last used its token; unset if it never has.
  google.protobuf.Timestamp last_active_at = 6;
  // How many servers it's in.
  int32 servers = 7;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message CreateAgentRequest {
  // Its username, like a person's: 2 to 32 of a-z, 0-9, _ and .
  string username = 1;
  // 1 to 64 characters.
  string display_name = 2;
}

message CreateAgentResponse {
  Agent agent = 1;
  // Shown this once: only its hash is kept.
  string token = 2;
}

message UpdateAgentRequest {
  string agent_id = 1;
  optional string display_name = 2;
  // Empty, or a picture the caller uploaded for it (MEDIA_PURPOSE_AVATAR).
  optional string avatar_url = 3;
  optional string bio = 4;
  optional bool public = 5;
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message ResetAgentTokenRequest {
  string agent_id = 1;
}

message ResetAgentTokenResponse {
  // Shown this once.
  string token = 1;
}

message DeleteAgentRequest {
  string agent_id = 1;
}

message DeleteAgentResponse {}

message AddAgentRequest {
  string server_id = 1;
  // The agent's username.
  string username = 2;
}

message AddAgentResponse {
  Member member = 1;
}

enum McpAccessMode {
  // Every agent in the server, as MCP_ACCESS_MODE_ALL.
  MCP_ACCESS_MODE_UNSPECIFIED = 0;
  MCP_ACCESS_MODE_ALL = 1;
  // Only the agents in McpAccess.agent_ids.
  MCP_ACCESS_MODE_CHOSEN = 2;
  // No agent: the server can't be used through MCP.
  MCP_ACCESS_MODE_OFF = 3;
}

message McpAccess {
  McpAccessMode mode = 1;
  // For MCP_ACCESS_MODE_CHOSEN: the agents' account ids, at most 100.
  repeated string agent_ids = 2;
}

message GetMcpAccessRequest {
  string server_id = 1;
}

message GetMcpAccessResponse {
  McpAccess access = 1;
}

message SetMcpAccessRequest {
  string server_id = 1;
  McpAccess access = 2;
}

message SetMcpAccessResponse {
  McpAccess access = 1;
}

// Where an agent hears about its events when it doesn't keep a stream open
// (docs/agent-endpoints.md). The instance posts each server's events to
// `url` in order, as an AgentDelivery in proto3 JSON, signed with `secret`
// the Standard Webhooks way (`webhook-id`, `webhook-timestamp`,
// `webhook-signature` headers).
message AgentEndpoint {
  string agent_id = 1;
  // https (or http where the instance allows any address); empty when off.
  string url = 2;
  // Which events go there, by their name in Event's payload
  // ("message_created", "interaction_created"...). Empty for all of them.
  repeated string events = 3;
  // "whsec_" and the key in base64, as Standard Webhooks libraries take it.
  string secret = 4;
  // When it was last set.
  google.protobuf.Timestamp updated_at = 5;
  // When a delivery last went through; unset if none has.
  google.protobuf.Timestamp last_delivered_at = 6;
  // Since when deliveries have been failing; unset while they work.
  google.protobuf.Timestamp failing_since = 7;
  // What went wrong last ("answered 500", "timed out"...).
  string last_error = 8;
  // When the instance turned it off after a day of failures. Set the URL
  // again to turn it back on; what happened meanwhile isn't sent.
  google.protobuf.Timestamp disabled_at = 9;
}

message GetAgentEndpointRequest {
  string agent_id = 1;
}

message GetAgentEndpointResponse {
  AgentEndpoint endpoint = 1;
}

message SetAgentEndpointRequest {
  string agent_id = 1;
  string url = 2;
  repeated string events = 3;
}

message SetAgentEndpointResponse {
  AgentEndpoint endpoint = 1;
}

message ResetAgentEndpointSecretRequest {
  string agent_id = 1;
}

message ResetAgentEndpointSecretResponse {
  AgentEndpoint endpoint = 1;
}

// What the instance posts to an agent's endpoint, as proto3 JSON.
message AgentDelivery {
  string agent_id = 1;
  // Set only on the check sent when the URL is saved, which has no events:
  // answer it with an AgentDeliveryAnswer carrying the same challenge.
  string challenge = 2;
  // One server's events, in order, as EventService.Subscribe would send them
  // to the agent (the same visibility, and interactions with their
  // arguments). A delivery that failed comes again, maybe with more events
  // after it, so skip ones whose (server_id, sequence) you've had. Channels
  // appearing or going as the agent's permissions change come with sequence
  // 0, right after the event that caused them. Events that aren't stored
  // (voice states, live tiles) aren't delivered.
  repeated Event events = 3;
}

// What an agent may answer a delivery with (any 2xx says it was received;
// a body is optional).
message AgentDeliveryAnswer {
  // The check's challenge, echoed back.
  string challenge = 1;
  // Answers to interactions in this delivery, each posted as if the agent
  // called SendMessage with interaction_id: the same permissions, slow mode
  // and AutoMod apply. A refused reply is dropped; the delivery still counts.
  repeated InteractionReply replies = 2;
}

message InteractionReply {
  string interaction_id = 1;
  string content = 2;
  repeated Embed embeds = 3;
  repeated ComponentRow components = 4;
}
