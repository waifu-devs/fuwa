[package]
name = "fuwa-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The fuwa server: a self-hostable, Discord-like chat server with one database per community server"
repository = "https://github.com/waifu-devs/fuwa"
publish = false
default-run = "fuwa"

[[bin]]
name = "fuwa"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"] }
base64 = "0.22"
bytes = "1"
dotenvy = "0.15"
futures = "0.3"
# Reads MLS message headers for direct messages; never decrypts.
fuwa-e2ee = { path = "../e2ee" }
getrandom = "0.3"
hmac = "0.12"
http = "1"
prost = "0.14"
prost-types = "0.14"
mime_guess = { version = "2", optional = true }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
# Embedded files get a fixed timestamp, so builds of one commit come out identical.
rust-embed = { version = "8", optional = true, features = ["deterministic-timestamps"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-web = "0.14"
tower-http = { version = "0.6", features = ["compression-gzip", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = "0.7.2"
ulid = "1"

[features]
# Embed the web client (web/dist, built with `pnpm build` in web/) and serve it on /.
web = ["dep:rust-embed", "dep:mime_guess"]

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
# Real devices for the direct-message tests.
fuwa-e2ee = { path = "../e2ee", features = ["client"] }
tempfile = "3"
