[package]
name = "fuwa-server"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "The fuwa server: a self-hostable, Discord-like chat server with one database per community server"
license = "Apache-2.0"
repository = "https://github.com/waifu-devs/fuwa"
publish = false
default-run = "fuwa"

[[bin]]
name = "fuwa"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "http2", "query", "tokio"] }
base64 = "0.22"
bytes = "1"
dotenvy = "0.15"
# Single sign-on: SAML requests are deflated (HTTP-Redirect binding).
flate2 = "1"
futures = "0.3"
# Reads MLS message headers for direct messages; never decrypts.
fuwa-e2ee = { path = "../e2ee" }
getrandom = "0.3"
hmac = "0.12"
http = "1"
prost = "0.14"
prost-types = "0.14"
mime_guess = { version = "2", optional = true }
percent-encoding = "2"
# Single sign-on: reading SAML responses (no DTDs, so no entity tricks).
roxmltree = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
# Single sign-on: checking OpenID Connect ID token signatures (RS, PS, ES, EdDSA).
ring = "0.17"
# WebRTC for calls (the media part), with pure-Rust crypto so builds stay reproducible.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
# Embedded files get a fixed timestamp, so builds of one commit come out identical.
rust-embed = { version = "8", optional = true, features = ["deterministic-timestamps"] }
# Single sign-on: checking SAML signatures against the provider's certificates,
# with the same ring that TLS uses.
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-web = "0.14"
tower-http = { version = "0.6", features = ["compression-gzip", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = "0.7.2"
ulid = "1"
url = "2"

[features]
# Embed the web client (web/dist, built with `pnpm build` in web/) and serve it on /.
web = ["dep:rust-embed", "dep:mime_guess"]

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
# Real devices for the direct-message tests.
fuwa-e2ee = { path = "../e2ee", features = ["client"] }
# The client programs use to be in voice channels, against a real instance.
fuwa-voice = { path = "../voice" }
tempfile = "3"
