[package]
name = "fuwa-voice"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Hear and talk in fuwa voice channels from a program: agents, bots and apps, without WebRTC"
license = "Apache-2.0"
repository = "https://github.com/waifu-devs/fuwa"
publish = false

[dependencies]
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1", features = ["time", "sync"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
