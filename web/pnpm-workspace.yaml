# pnpm settings for the web app.
# buf's install script isn't needed: pnpm installs its binary as a platform package.
# vgpu's Node adapter (and the Dawn build under it) is for its command line, not the app.
ignoredBuiltDependencies:
  - "@bufbuild/buf"
  - "@vgpu/adapter-node"
  - "webgpu"
# A new release waits a week before installs pick it up, and a package whose provenance or signatures
# weaken between versions is refused.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
